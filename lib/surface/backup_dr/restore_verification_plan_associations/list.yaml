- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: true
  help_text:
    brief: List Backup and DR restore verification plan associations.
    description: List restore verification plan associations in the project for a specified restore verification plan.
    examples: |
      To list restore verification plan associations for restore verification plan ``my-plan'' in location ``us-central1'', run:

        $ {command} --restore-verification-plan=my-plan --location=us-central1

  request:
    GA:
      api_version: v1
    BETA:
      api_version: v1beta
    ALPHA:
      api_version: v1alpha
    collection: backupdr.projects.locations.restoreVerificationPlans.associations

  response:
    id_field: name

  arguments:
    resource:
      help_text: Restore verification plan to list associations from.
      spec: !REF googlecloudsdk.command_lib.backupdr.resources:restoreVerificationPlanDefault
      is_positional: false

  output:
    format: |
      table(
        name:label=NAME:sort=1,
        resourceType,
        restoreTemplate:label=TEMPLATE,
        state,
        triggerSummary.nextTriggerTime:label=NEXT_TRIGGER
      )
