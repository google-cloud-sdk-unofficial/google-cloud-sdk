- release_tracks: [ALPHA]
  hidden: true
  help_text:
    brief: List restore verification plans in a project.
    description: |
      List restore verification plans in a project.
    examples: |
      To list restore verification plans for all locations, run:

        $ {command}

      To list restore verification plans in location `us-central1`, run:

        $ {command} --location=us-central1
  request:
    ALPHA:
      api_version: v1alpha
    collection: backupdr.projects.locations.restoreVerificationPlans

  response:
    id_field: name

  arguments:
    resource:
      help_text: The location to list restore verification plans for.
      spec: !REF googlecloudsdk.command_lib.backupdr.resources:locationDefaultGlobal

  output:
    format: |
      table(
        name.basename():label=PLAN_ID:sort=1,
        schedule,
        timeZone,
        state,
        createTime
      )
