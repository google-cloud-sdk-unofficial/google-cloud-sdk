- release_tracks: [ALPHA]
  hidden: true
  hints:
    read_only: true
  help_text:
    brief: Show details of the restore template execution.
    description: Show all configuration data associated with the specified restore template execution.
    examples: |
      To view details for restore template execution `my-exec` under restore template `my-template` in location `us-central1`, run:

        $ {command} my-exec --restore-template=my-template --location=us-central1

  request:
    ALPHA:
      api_version: v1alpha
    collection: backupdr.projects.locations.restoreTemplates.executions

  response:
    id_field: name
    modify_response_hooks:
    - googlecloudsdk.command_lib.backupdr.declarative:PreserveApiJsonOrderResponseHook

  arguments:
    resource:
      help_text: Name of the restore template execution to describe.
      spec: !REF googlecloudsdk.command_lib.backupdr.resources:restoreTemplateExecutions
      is_positional: true

  output:
    format: object
