- release_tracks: [ALPHA]
  hidden: true
  hints:
    read_only: false

  help_text:
    brief: Link the BigQuery dataset for a Backup and DR Backup Insight Plan.
    description: |
      Link the BigQuery dataset containing backup metadata insights for a
      Backup and DR Backup Insight Plan to the backup vault's consumer project.

      The Backup Insight Plan must be in the `ACTIVE` state and have the
      insight type `BACKUP_METADATA_INDEXING`. When the operation completes,
      the linked dataset is shown in
      `backupMetadataInsightSettings.datasetLink.dataset`.
    examples: |
      To link the dataset for a Backup Insight Plan named 'my-insight-plan' in backup vault 'my-vault' and location 'us-central1':

        $ {command} my-insight-plan --backup-vault=my-vault --location=us-central1

      To link the dataset without waiting for the operation to complete:

        $ {command} my-insight-plan --backup-vault=my-vault --location=us-central1 --async

  request:
    collection: backupdr.projects.locations.backupVaults.backupInsightPlans
    regional_endpoint_compatibility: SUPPORTED
    method: linkDataset
    display_resource_type: backup insight plan
    ALPHA:
      api_version: v1alpha

  async:
    collection: backupdr.projects.locations.operations
    ALPHA:
      api_version: v1alpha

  arguments:
    resource:
      help_text: The Backup Insight Plan whose dataset to link.
      spec: !REF googlecloudsdk.command_lib.backupdr.resources:backupInsightPlan
      is_positional: true

  output:
    format: json
