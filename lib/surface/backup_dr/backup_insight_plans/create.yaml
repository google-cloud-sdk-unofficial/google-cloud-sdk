- release_tracks: [ALPHA]
  hidden: true

  help_text:
    brief: Create a Backup and DR Backup Insight Plan.
    description: |
      Create a Backup and DR Backup Insight Plan in a specified backup vault.
    examples: |
      To create a Backup Insight Plan named 'my-insight-plan' in backup vault 'my-vault' and location 'us-central1':

        $ {command} my-insight-plan --backup-vault=my-vault --location=us-central1 --insight-type=backup-metadata-indexing

  request:
    collection: backupdr.projects.locations.backupVaults.backupInsightPlans
    display_resource_type: backup insight plan
    ALPHA:
      api_version: v1alpha

  async:
    collection: backupdr.projects.locations.operations
    ALPHA:
      api_version: v1alpha

  arguments:
    resource:
      help_text: The Backup Insight Plan to create.
      spec: !REF googlecloudsdk.command_lib.backupdr.resources:backupInsightPlan
      is_positional: true

    params:
    - arg_name: insight-type
      api_field: backupInsightPlan.backupInsightType
      required: true
      help_text: |
        The type of insight this plan enables.
      choices:
      - arg_value: backup-metadata-indexing
        enum_value: BACKUP_METADATA_INDEXING
        help_text: Backup metadata indexing insight.
