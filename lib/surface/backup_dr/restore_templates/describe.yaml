- release_tracks: [ALPHA]
  hidden: true
  help_text:
    brief: Show details of the restore template.
    description: Show all configuration data associated with the specified restore template.
    examples: |
      To view details for restore template `my-template` in location `us-central1`, run:

        $ {command} my-template --location=us-central1

  request:
    ALPHA:
      api_version: v1alpha
    collection: backupdr.projects.locations.restoreTemplates

  response:
    id_field: name

  arguments:
    resource:
      help_text: Name of the restore template to describe.
      spec: !REF googlecloudsdk.command_lib.backupdr.resources:restoreTemplates

  output:
    format: json
