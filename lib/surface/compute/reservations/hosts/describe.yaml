release_tracks: [ALPHA, BETA, GA]
help_text:
  brief: Describe a Google Compute Engine host in a reservation.
  description: |
    Describe a Google Compute Engine host in a reservation.
  examples: |
    To describe a host named `my-host` in reservation `my-reservation` and zone `us-central1-a`:

      $ {command} my-host --reservation=my-reservation --zone=us-central1-a
request:
  ALPHA:
    api_version: alpha
  BETA:
    api_version: beta
  GA:
    api_version: v1
  collection: compute.hosts
  method: get
  modify_request_hooks:
  - googlecloudsdk.command_lib.compute.hosts.util:CreateAssociationHook
arguments:
  resource:
    help_text: The name of the host to describe.
    spec: !REF googlecloudsdk.command_lib.compute.resources:host
  params:
  - arg_name: reservation
    required: false
    help_text: |
      Name of the reservation the host is associated with.
  - arg_name: reservation-block
    required: false
    help_text: |
      Name of the reservation block the host is associated with. This argument requires `--reservation` to be specified.
  - arg_name: reservation-subblock
    release_tracks: [ALPHA]
    required: false
    help_text: |
      Name of the reservation subblock the host is associated with. This argument requires `--reservation` and `--reservation-block` to be specified.
