release_tracks: [ALPHA, BETA, GA, PREVIEW]
help_text:
  brief: Test IAM permissions for a Compute Engine resource policy.
  description: |
    Returns permissions that a caller has on the specified resource policy.

  examples: |
    To test if the caller has 'compute.resourcePolicies.get' permission on a resource policy `my-resource-policy`, run:

      $ {command} my-resource-policy --region=REGION --permissions=compute.resourcePolicies.get

request:
  collection: compute.resourcePolicies
  api_version: v1
  method: testIamPermissions
  use_relative_name: false
  BETA:
    api_version: beta
  ALPHA:
    api_version: alpha

command_type: GENERIC

arguments:
  resource:
    help_text: The resource policy for which to test permissions.
    spec: !REF googlecloudsdk.command_lib.compute.resources:resource_policy
  params:
  - arg_name: permissions
    api_field: testPermissionsRequest.permissions
    required: true
    repeated: true
    help_text: |-
      The permissions to test.
