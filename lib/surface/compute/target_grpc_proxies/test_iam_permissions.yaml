release_tracks: [ALPHA]
help_text:
  brief: Test IAM permissions for a Compute Engine target gRPC proxy.
  description: |
    Returns permissions that a caller has on the specified target gRPC proxy.

  examples: |
    To test if the caller has 'compute.targetGrpcProxies.get' permission on a target gRPC proxy `my-proxy`, run:

      $ {command} my-proxy --permissions=compute.targetGrpcProxies.get

request:
  collection: compute.targetGrpcProxies
  api_version: alpha
  method: testIamPermissions
  use_relative_name: false

command_type: GENERIC

arguments:
  resource:
    help_text: The target gRPC proxy for which to test permissions.
    spec: !REF googlecloudsdk.command_lib.compute.resources:target_grpc_proxy
  params:
  - arg_name: permissions
    api_field: testPermissionsRequest.permissions
    required: true
    repeated: true
    help_text: |-
      Permissions to test.
