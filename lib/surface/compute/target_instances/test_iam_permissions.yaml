release_tracks: [ALPHA]
help_text:
  brief: Test IAM permissions for a Compute Engine target instance.
  description: |
    Returns permissions that a caller has on the specified target instance.

  examples: |
    To test if the caller has 'compute.targetInstances.get' permission on a target instance `my-instance`, run:

      $ {command} my-instance --zone=ZONE --permissions=compute.targetInstances.get

request:
  collection: compute.targetInstances
  api_version: alpha
  method: testIamPermissions
  use_relative_name: false

command_type: GENERIC

arguments:
  resource:
    help_text: The target instance for which to test permissions.
    spec: !REF googlecloudsdk.command_lib.compute.resources:target_instance
  params:
  - arg_name: permissions
    api_field: testPermissionsRequest.permissions
    required: true
    repeated: true
    help_text: |-
      The permissions to test.
