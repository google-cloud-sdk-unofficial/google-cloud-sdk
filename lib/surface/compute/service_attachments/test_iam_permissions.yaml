- release_tracks: [ALPHA, BETA]
  help_text:
    brief: Test IAM permissions for a Compute Engine service attachment.
    description: |
      Returns permissions that a caller has on the specified service attachment.
    examples: |
      To test if the caller has `compute.serviceAttachments.get` permission on a service attachment, run:

        $ {command} my-service-attachment --region=``REGION'' --permissions=compute.serviceAttachments.get

  request:
    collection: compute.serviceAttachments
    api_version: v1
    method: testIamPermissions
    use_relative_name: false
    BETA:
      api_version: beta
    ALPHA:
      api_version: alpha

  command_type: GENERIC

  arguments:
    resource:
      help_text: The service attachment for which to test permissions.
      spec: !REF googlecloudsdk.command_lib.compute.resources:service_attachment
    params:
    - arg_name: permissions
      api_field: testPermissionsRequest.permissions
      required: true
      repeated: true
      help_text: |-
        Permissions to be tested.
