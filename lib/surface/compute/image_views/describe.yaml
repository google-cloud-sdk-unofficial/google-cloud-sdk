- release_tracks: [ALPHA, BETA, GA]

  help_text:
    brief: Describe a Compute Engine image-view resource.
    description: |
      *{command}* displays all data associated with the Compute Engine
      image-view resource.
    examples: |
      To describe an image-view resource named `my-image-view` in region `us-central1`:

        $ {command} my-image-view --region=us-central1

  request:
    collection: compute.imageViews
    ALPHA:
      api_version: alpha
    BETA:
      api_version: beta
    GA:
      api_version: v1
    method: get

  arguments:
    resource:
      help_text: Name of the image-view resource to describe.
      spec: !REF googlecloudsdk.command_lib.compute.resources:image_view
