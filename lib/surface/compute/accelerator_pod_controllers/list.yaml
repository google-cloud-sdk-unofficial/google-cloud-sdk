- release_tracks: [ALPHA]
  hints:
    read_only: true
  help_text:
    brief: List Google Compute Engine accelerator pod controllers.
    description: List Google Compute Engine accelerator pod controllers in a given project and zone.
    examples: |
      To list accelerator pod controllers in zone `us-east5-staginga`:

        $ {command} --zone=us-east5-staginga

  request:
    ALPHA:
      api_version: alpha
    collection: compute.acceleratorPodControllers
    method: list

  arguments:
    resource:
      help_text: The zone to list accelerator pod controllers for.
      spec: !REF googlecloudsdk.command_lib.compute.resources:zone
      is_positional: false

  response:
    id_field: name

  output:
    format: |
      table(
        name,
        zone.basename(),
        target,
        description
      )
