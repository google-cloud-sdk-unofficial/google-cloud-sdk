release_tracks: [ALPHA, BETA, GA, PREVIEW]

help_text:
  brief: Set the IAM policy for a Compute Engine interconnect attachment group.
  description: |
    Sets the IAM policy for the given interconnect attachment group as defined in a JSON or YAML file.

  examples: |
    The following command will read an IAM policy defined in a JSON file
    'policy.json' and set it for the interconnect attachment group `my-interconnect-attachment-group`:

      $ {command} my-interconnect-attachment-group policy.json

    See https://cloud.google.com/iam/docs/managing-policies for details of the
    policy file format and contents.

request:
  collection: compute.interconnectAttachmentGroups
  api_version: v1
  use_relative_name: false
  modify_request_hooks:
  - googlecloudsdk.command_lib.iam.hooks:UseMaxRequestedPolicyVersion:api_field=globalSetPolicyRequest.policy.version
  BETA:
    api_version: beta
  ALPHA:
    api_version: alpha

iam:
  set_iam_policy_request_path: globalSetPolicyRequest
  message_type_overrides:
    policy: Policy
    set_iam_policy_request: ComputeInterconnectAttachmentGroupsSetIamPolicyRequest

arguments:
  resource:
    help_text: The interconnect attachment group to set the IAM policy for.
    spec: !REF googlecloudsdk.command_lib.compute.resources:interconnect_attachment_group
