release_tracks: [ALPHA]
hints:
  read_only: false

help_text:
  brief: Set the IAM policy for a Compute Engine interconnect.
  description: |
    Sets the IAM policy for the given interconnect as defined in a JSON or YAML file.

  examples: |
    The following command will read an IAM policy defined in a JSON file
    'policy.json' and set it for the interconnect `my-interconnect`:

      $ {command} my-interconnect policy.json

    See https://cloud.google.com/iam/docs/managing-policies for details of the
    policy file format and contents.

request:
  collection: compute.interconnects
  use_relative_name: false
  regional_endpoint_compatibility: SUPPORTED
  modify_request_hooks:
  - googlecloudsdk.command_lib.iam.hooks:UseMaxRequestedPolicyVersion:api_field=globalSetPolicyRequest.policy.version
  api_version: alpha

iam:
  set_iam_policy_request_path: globalSetPolicyRequest
  message_type_overrides:
    policy: Policy
    set_iam_policy_request: ComputeInterconnectsSetIamPolicyRequest

arguments:
  resource:
    help_text: The interconnect to set IAM policy for.
    spec: !REF googlecloudsdk.command_lib.compute.resources:interconnect
