release_tracks: [ALPHA, BETA, GA, PREVIEW]
help_text:
  brief: Test IAM permissions for a Compute Engine target SSL proxy.
  description: |
    Returns permissions that a caller has on the specified target SSL proxy.

  examples: |
    To test if the caller has the 'compute.targetSslProxies.get' permission on a target SSL proxy `my-target-ssl-proxy`, run:

      $ {command} my-target-ssl-proxy --permissions=compute.targetSslProxies.get

request:
  collection: compute.targetSslProxies
  api_version: v1
  method: testIamPermissions
  use_relative_name: false
  BETA:
    api_version: beta
  ALPHA:
    api_version: alpha
  PREVIEW:
    api_version: v1

command_type: GENERIC

arguments:
  resource:
    help_text: The target SSL proxy for which to test permissions.
    spec: !REF googlecloudsdk.command_lib.compute.resources:target_ssl_proxy
  params:
  - arg_name: permissions
    api_field: testPermissionsRequest.permissions
    required: true
    repeated: true
    help_text: |-
      Permissions to test.
