- release_tracks: [BETA]
  hidden: true

  help_text:
    brief: Delete a MACsec key group.
    description: Delete the specified MACsec key group.
    examples: |
      To delete a MACsec key group named 'my-key-group' in the 'us-central1' region:

        $ {command} my-key-group --region=us-central1

  arguments:
    resource:
      spec: !REF googlecloudsdk.command_lib.network_connectivity.resources:macsecKeyGroup
      help_text: Name of the MACsec key group to be deleted.

  input:
    confirmation_prompt: 'You are about to delete MACsec key group [{__relative_name__}]'

  async:
    collection: networkconnectivity.projects.locations.operations

  request:
    BETA:
      api_version: v1beta
    collection: networkconnectivity.projects.locations.interconnectKeyGroups
    method: delete
