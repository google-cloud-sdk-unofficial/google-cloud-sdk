- release_tracks: [BETA]
  hidden: true

  help_text:
    brief: Describe a MACsec key group.
    description: Retrieve and display details about a MACsec key group.
    examples: |
      To display details about a MACsec key group named 'my-key-group' in the 'us-central1' region, run:

        $ {command} my-key-group --region=us-central1

  request:
    BETA:
      api_version: v1beta
    collection: networkconnectivity.projects.locations.interconnectKeyGroups
    method: get

  arguments:
    resource:
      spec: !REF googlecloudsdk.command_lib.network_connectivity.resources:macsecKeyGroup
      help_text: Name of the MACsec key group to be described.
