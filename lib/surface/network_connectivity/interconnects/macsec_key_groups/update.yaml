- release_tracks: [BETA]
  hidden: true

  help_text:
    brief: Update a MACsec key group.
    description: Update a MACsec key group with the given name.
    examples: |
      To update the description of a MACsec key group named 'my-key-group' in us-central1:

        $ {command} my-key-group --region=us-central1 --description="Updated MACsec key group"

  arguments:
    resource:
      spec: !REF googlecloudsdk.command_lib.network_connectivity.resources:macsecKeyGroup
      help_text: Name of the MACsec key group to be updated.
    params:
    - arg_name: description
      api_field: googleCloudNetworkconnectivityV1betaInterconnectKeyGroup.description
      help_text: Description of the MACsec key group.
    labels:
      api_field: googleCloudNetworkconnectivityV1betaInterconnectKeyGroup.labels

  async:
    collection: networkconnectivity.projects.locations.operations

  request:
    BETA:
      api_version: v1beta
    collection: networkconnectivity.projects.locations.interconnectKeyGroups
    method: patch
