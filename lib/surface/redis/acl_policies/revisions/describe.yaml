release_tracks: [ALPHA]
hidden: true
help_text:
  brief: |
    Show metadata for a Memorystore for Redis Cluster ACL policy revision.
  description: |
    Show metadata for a Memorystore for Redis Cluster ACL policy revision.

    Displays all metadata associated with an ACL policy revision given a valid ACL policy revision name.

    This command can fail for the following reasons:
      * The ACL policy revision specified does not exist.
      * The active account does not have permission to access the given
        ACL policy revision.
  examples: |
    To display the metadata for an ACL policy revision named `my-acl-policy-revision` for ACL policy `my-acl-policy`, in `us-central1` region, run:

    $ {command} my-acl-policy-revision --acl-policy=my-acl-policy --region=us-central1

arguments:
  resource:
    spec: !REF googlecloudsdk.command_lib.redis.resources:acl_policy_revision
    help_text: |
      Arguments and flags that specify the ACL policy revision you want to describe.

request:
  ALPHA:
    api_version: v1alpha1
  BETA:
    api_version: v1beta1
  GA:
    api_version: v1
  collection: redis.projects.locations.aclPolicies.revisions
