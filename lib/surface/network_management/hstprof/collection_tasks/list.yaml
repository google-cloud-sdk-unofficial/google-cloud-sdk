release_tracks: [ALPHA]

help_text:
  brief: |
    List High-Speed Telemetry (HST) collection tasks.
  description: |
    List High-Speed Telemetry (HST) collection tasks in a given project and location.
  examples: |
    To list all collection tasks in location `us-central1`:

      $ {command} --location=us-central1

arguments:
  resource:
    spec: !REF googlecloudsdk.command_lib.network_management.resources:location
    help_text: |
      Location of the HST collection tasks to list.

request:
  ALPHA:
    api_version: v1alpha
  collection: hstprof.projects.locations.hstCollectionTasks
  method: list

output:
  format: |
    table(
      name.basename():label=NAME,
      state:label=STATE,
      destinationUri:label=DESTINATION_URI,
      collectionDuration:label=DURATION,
      createTime.date():label=CREATE_TIME
    )
