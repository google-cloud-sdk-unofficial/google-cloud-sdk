- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: true
  help_text:
    brief: Describe a rollout.
    description: |-
      Display the details of an App Lifecycle Manager rollout.
    examples: |-
      To describe the rollout named `my-rollout` in location `us-central1`, run:

        $ {command} my-rollout --location=us-central1

      To display only the release and state of the rollout named `my-rollout` in
      location `us-central1`, run:

        $ {command} my-rollout --location=us-central1 --format="yaml(release,state)"
  ALPHA:
    help_text:
      brief: Describe a Rollout
      description: Describe a Rollout
      examples: |-
        To describe the Rollout, run:

        $ {command}
  arguments:
    params:
    - help_text: |-
        Rollout to describe.
      ALPHA:
        help_text: Name of the resource
      is_positional: true
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:rollout
      required: true
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.rollouts
