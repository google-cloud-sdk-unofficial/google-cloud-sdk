- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: false
  help_text:
    brief: Update a rollout.
    description: |-
      Update an App Lifecycle Manager rollout.

      Use `--control-action` to pause, resume, or cancel a rollout.
    examples: |-
      To pause the rollout named `my-rollout` in location `us-central1`, run:

        $ {command} my-rollout --location=us-central1 --control-action=pause

      To resume the paused rollout named `my-rollout` without retrying its
      failed operations, run:

        $ {command} my-rollout --location=us-central1 --control-action=run --no-retry-failed-operations

      To cancel the rollout named `my-rollout` permanently, run:

        $ {command} my-rollout --location=us-central1 --control-action=cancel
  ALPHA:
    help_text:
      brief: Update a Rollout
      description: Update a Rollout
      examples: |-
        To update the Rollout, run:

        $ {command}
  arguments:
    params:
    - help_text: |-
        Rollout to update.
      ALPHA:
        help_text: |-
          Identifier. The resource name (full URI of the resource) following the standard naming
          scheme:

            "projects/{project}/locations/{location}/rollout/{rollout_id}"
      is_positional: true
      is_primary_resource: true
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:rollout
      required: true
    - arg_name: rollout-orchestration-strategy
      api_field: rollout.rolloutOrchestrationStrategy
      required: false
      repeated: false
      help_text: |-
        Strategy to use for executing this rollout. Supported values are
        `Google.Cloud.Simple.AllAtOnce`,
        `Google.Cloud.Simple.OneLocationAtATime`,
        `Google.Cloud.Progressive.Gradual.v1`, and
        `Google.Cloud.Progressive.SingleLocation.v1`. If not set when the
        rollout is created, the strategy from the rollout kind is used.
      ALPHA:
        help_text: |-
          The strategy to use for executing this rollout. If not provided, the
          strategy from Rollout Type will be used.
    - arg_name: unit-filter
      api_field: rollout.unitFilter
      required: false
      repeated: false
      help_text: |-
        Filter, in Common Expression Language (CEL) format, that selects the
        eligible units. The filter can only reduce, not expand, the scope of
        the rollout. If empty, the unit filter from the rollout kind is used.
        For more information about CEL, see
        https://github.com/google/cel-spec.
      ALPHA:
        help_text: |-
          CEL(https://github.com/google/cel-spec) formatted filter string against
          Unit. The filter will be applied to determine the eligible unit population.
          This filter can only reduce, but not expand the scope of the rollout. If
          not provided, the unit_filter from the RolloutType will be used.
    - group:
        api_field: rollout.control
        arg_name: control
        clearable: true
        required: false
        help_text: |-
          Rollout control, which requests a change to the execution of the
          rollout, such as pausing or canceling it. Requests can only be made
          when the rollout is in a non-terminal state.
        ALPHA:
          help_text: |-
            RolloutControl provides a way to request a change to the execution of a
            Rollout by pausing or canceling it.
        params:
        - group:
            mutex: true
            help_text: |-
              Action parameters.
            ALPHA:
              help_text: Arguments for the action params.
            params:
            - group:
                api_field: rollout.control.runParams
                required: false
                help_text: |-
                  Parameters for the `run` action that control the behavior of
                  the rollout when it is resumed from a paused state. By
                  default, the rollout retries failed operations when resumed.
                  Can be specified only when `--control-action=run`.
                ALPHA:
                  help_text: |-
                    Parameters for the RUN action controlling the behavior of the rollout
                    when it is resumed from a PAUSED state.
                params:
                - arg_name: retry-failed-operations
                  api_field: rollout.control.runParams.retryFailedOperations
                  action: store_true_false
                  required: false
                  type: bool
                  help_text: |-
                    Retry failed operations when the rollout is resumed. Applies
                    only if the rollout is paused.
                  ALPHA:
                    help_text: |-
                      If true, the rollout will retry failed operations when resumed.
                      This is applicable only the current state of the Rollout is PAUSED and
                      the requested action is RUN.
        - arg_name: control-action
          api_field: rollout.control.action
          required: false
          help_text: |-
            Action to perform on the rollout. If no action is set, the rollout
            runs until it naturally reaches a terminal state.
          ALPHA:
            help_text: |-
              Action to be performed on the Rollout.
              The default behavior is to run the rollout until it naturally reaches a
              terminal state.
          choices:
          - arg_value: run
            enum_value: ROLLOUT_ACTION_RUN
            help_text: |-
              Run the rollout until it naturally reaches a terminal state. A
              rollout requested to run progresses through all natural rollout
              states, such as from running to succeeded or from running to
              failed. If errors that can be retried occur during the rollout,
              the rollout is paused by default and can be resumed by requesting
              the `run` action again.
            ALPHA:
              help_text: |-
                Run the Rollout until it naturally reaches a terminal state.
                A rollout requested to run will progress through all natural Rollout
                States (such as RUNNING -> SUCCEEDED or RUNNING -> FAILED).
                If retriable errors are encountered during the rollout, the rollout
                will paused by default and can be resumed by re-requesting this RUN
                action.
          - arg_value: pause
            enum_value: ROLLOUT_ACTION_PAUSE
            help_text: |-
              Pause the rollout until it is resumed (that is, until the `run`
              action is requested).
            ALPHA:
              help_text: |-
                Pause the Rollout until it is resumed (i.e. RUN is requested).
          - arg_value: cancel
            enum_value: ROLLOUT_ACTION_CANCEL
            help_text: |-
              Cancel the rollout permanently.
            ALPHA:
              help_text: Cancel the Rollout permanently.
    - arg_name: labels
      api_field: rollout.labels
      required: false
      repeated: true
      help_text: |-
        Labels on the resource, which can be used for categorization, similar
        to Kubernetes resource labels.
      ALPHA:
        help_text: |-
          The labels on the resource, which can be used for categorization.
          similar to Kubernetes resource labels.
      clearable: true
      spec:
      - api_field: key
      - api_field: value
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.rollouts
  update:
    read_modify_update: true
