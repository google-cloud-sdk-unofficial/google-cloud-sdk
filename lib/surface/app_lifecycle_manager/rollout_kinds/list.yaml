- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: true
  help_text:
    brief: List rollout kinds.
    description: |-
      List App Lifecycle Manager rollout kinds.

      If `--location` is not specified, rollout kinds in all locations are
      listed.
    examples: |-
      To list all rollout kinds in location `us-central1`, run:

        $ {command} --location=us-central1

      To list only the names of rollout kinds with the label `env=prod` in all
      locations, run:

        $ {command} --filter="labels.env=prod" --format="value(name)"
  ALPHA:
    help_text:
      brief: List Rollout Kinds
      description: List Rollout Kinds
      examples: |-
        To list all Rollout Kinds, run:

        $ {command}
  arguments:
    resource:
      help_text: |-
        Location of the rollout kinds to list.
      ALPHA:
        help_text: Parent value for ListRolloutKindsRequest
      spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:project_location_with_default
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.rolloutKinds
  response:
    id_field: name
