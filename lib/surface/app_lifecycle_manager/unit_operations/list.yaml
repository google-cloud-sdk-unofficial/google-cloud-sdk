- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: true
  help_text:
    brief: List unit operations.
    description: |-
      List App Lifecycle Manager unit operations.

      If `--location` is not specified, unit operations in all locations are
      listed.
    examples: |-
      To list all unit operations in location `us-central1`, run:

        $ {command} --location=us-central1

      To list only the names of unit operations with the label `env=prod` in all
      locations, run:

        $ {command} --filter="labels.env=prod" --format="value(name)"
  ALPHA:
    help_text:
      brief: List Unit Operations
      description: List Unit Operations
      examples: |-
        To list all Unit Operations, run:

        $ {command}
  arguments:
    resource:
      help_text: |-
        Location of the unit operations to list.
      ALPHA:
        help_text: The parent of the unit operation.
      spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:project_location_with_default
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.unitOperations
  response:
    id_field: name
