- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: true
  help_text:
    brief: Describe a unit operation.
    description: |-
      Display the details of an App Lifecycle Manager unit operation.
    examples: |-
      To describe the unit operation named `my-unit-operation` in location
      `us-central1`, run:

        $ {command} my-unit-operation --location=us-central1

      To display only the unit and state of the unit operation named
      `my-unit-operation` in location `us-central1`, run:

        $ {command} my-unit-operation --location=us-central1 --format="yaml(unit,state)"
  ALPHA:
    help_text:
      brief: Describe a Unit Operation
      description: Describe a Unit Operation
      examples: |-
        To describe the Unit Operation, run:

        $ {command}
  arguments:
    params:
    - help_text: |-
        Unit operation to describe.
      ALPHA:
        help_text: The resource name of the resource within a service.
      is_positional: true
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:unit_operation
      required: true
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.unitOperations
