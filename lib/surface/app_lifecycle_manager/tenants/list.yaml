- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: true
  help_text:
    brief: List tenants.
    description: |-
      List App Lifecycle Manager tenants.

      If `--location` is not specified, tenants in all locations are listed.
    examples: |-
      To list all tenants in location `us-central1`, run:

        $ {command} --location=us-central1

      To list only the names of tenants with the label `env=prod` in all
      locations, run:

        $ {command} --filter="labels.env=prod" --format="value(name)"
  ALPHA:
    help_text:
      brief: List Tenants
      description: List Tenants
      examples: |-
        To list all Tenants, run:

        $ {command}
  arguments:
    resource:
      help_text: |-
        Location of the tenants to list.
      ALPHA:
        help_text: Parent value for ListTenantsRequest
      spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:project_location_with_default
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.tenants
  response:
    id_field: name
