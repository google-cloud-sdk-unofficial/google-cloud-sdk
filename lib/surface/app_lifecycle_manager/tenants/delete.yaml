- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: false
  help_text:
    brief: Delete a tenant.
    description: |-
      Delete an App Lifecycle Manager tenant.

      The command prompts for confirmation before the tenant is deleted.
    examples: |-
      To delete the tenant named `my-tenant` in location `us-central1`, run:

        $ {command} my-tenant --location=us-central1

      To delete the tenant named `my-tenant` in location `us-central1` without a
      confirmation prompt, run:

        $ {command} my-tenant --location=us-central1 --quiet
  ALPHA:
    help_text:
      brief: Delete a Tenant
      description: Delete a Tenant
      examples: |-
        To delete the Tenant, run:

        $ {command}
  arguments:
    params:
    - help_text: |-
        Tenant to delete.
      ALPHA:
        help_text: Name of the resource
      is_positional: true
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:tenant
      required: true
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.tenants
