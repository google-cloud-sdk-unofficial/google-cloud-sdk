- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: true
  help_text:
    brief: List releases.
    description: |-
      List App Lifecycle Manager releases.

      If `--location` is not specified, releases in all locations are listed.
    examples: |-
      To list all releases in location `us-central1`, run:

        $ {command} --location=us-central1

      To list only the names of releases with the label `env=prod` in all
      locations, run:

        $ {command} --filter="labels.env=prod" --format="value(name)"
  ALPHA:
    help_text:
      brief: List releases
      description: List releases
      examples: |-
        To list releases in us-central1, run:

        $ {command}
  arguments:
    resource:
      help_text: |-
        Location of the releases to list.
      ALPHA:
        help_text: Parent value for ListReleasesRequest
      spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:project_location_with_default
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.releases
  response:
    id_field: name
