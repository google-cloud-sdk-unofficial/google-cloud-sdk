- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: true
  help_text:
    brief: Describe a unit kind.
    description: |-
      Display the details of an App Lifecycle Manager unit kind.
    examples: |-
      To describe the unit kind named `my-unit-kind` in location `us-central1`,
      run:

        $ {command} my-unit-kind --location=us-central1

      To display only the SaaS offering and default release of the unit kind
      named `my-unit-kind` in location `us-central1`, run:

        $ {command} my-unit-kind --location=us-central1 --format="yaml(saas,defaultRelease)"
  ALPHA:
    help_text:
      brief: Describe a Unit Kind
      description: Describe a Unit Kind
      examples: |-
        To describe the Unit Kind, run:

        $ {command}
  arguments:
    params:
    - help_text: |-
        Unit kind to describe.
      ALPHA:
        help_text: Name of the resource
      is_positional: true
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:unit_kind
      required: true
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.unitKinds
