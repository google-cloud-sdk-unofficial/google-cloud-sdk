- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: false
  help_text:
    brief: Update a unit.
    description: |-
      Update an App Lifecycle Manager unit.
    examples: |-
      To add or update the label `env=prod` on the unit named `my-unit` in
      location `us-central1`, run:

        $ {command} my-unit --location=us-central1 --update-labels=env=prod

      To pin the current release of the unit named `my-unit` until the end of
      2099, run:

        $ {command} my-unit --location=us-central1 --maintenance-pinned-until-time=2099-12-31T23:59:59Z
  ALPHA:
    help_text:
      brief: Update a Unit
      description: Update a Unit
      examples: |-
        To update the Unit, run:

        $ {command}
  arguments:
    params:
    - help_text: |-
        Unit to update.
      ALPHA:
        help_text: |-
          Identifier. The resource name (full URI of the resource) following the standard naming
          scheme:

            "projects/{project}/locations/{location}/units/{unit}"
      is_positional: true
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:unit
      required: true
    - arg_name: unit-kind
      help_text: |-
        Unit kind that this unit belongs to. The unit kind cannot be changed
        after it is set.
      ALPHA:
        help_text: |-
          Reference to the UnitKind this Unit belongs to. Immutable once set.
      is_positional: false
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:unit_kind
      resource_method_params:
        unit.unitKind: '{__relative_name__}'
      required: false
      clearable: true
    - arg_name: tenant
      help_text: |-
        Tenant that this unit belongs to. For example, the tenant informs the
        maintenance policies to use for scheduling future updates on the unit.
        The tenant is optional and cannot be changed after the unit is created.
      ALPHA:
        help_text: |-
          Reference to the Saas Tenant resource this unit belongs to. This for
          example informs the maintenance policies to use for scheduling future
          updates on a unit. (optional and immutable once created)
      is_positional: false
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:tenant
      resource_method_params:
        unit.tenant: '{__relative_name__}'
      required: false
      clearable: true
    - group:
        required: false
        help_text: |-
          Requested directives for performing future maintenance on the unit.
          These directives include a request for the unit to skip maintenance
          for a period of time and remain pinned to its current release. They
          also include controls for postponing scheduled maintenance.
        ALPHA:
          help_text: |-
            Captures requested directives for performing future maintenance on the
            unit. This includes a request for the unit to skip maintenance for a period
            of time and remain pinned to its current release as well as controls for
            postponing maintenance scheduled in future.
        params:
        - arg_name: maintenance-pinned-until-time
          api_field: unit.maintenance.pinnedUntilTime
          required: false
          repeated: false
          type: googlecloudsdk.core.util.times:ParseDateTime
          processor: googlecloudsdk.core.util.times:FormatDateTime
          help_text: |-
            Time until which the release of the unit is pinned. Until this
            time, changes to the release of the unit are rejected, and
            rollouts do not request an upgrade of the unit.
          ALPHA:
            help_text: |-
              If present, it fixes the release on the unit until the given time; i.e.
              changes to the release field will be rejected. Rollouts should and will
              also respect this by not requesting an upgrade in the first place.
    - arg_name: flag-revisions
      # The Flags API is not public in v1.
      release_tracks: [ALPHA, BETA]
      help_text: |-
        Flag revisions used by this unit.
      ALPHA:
        help_text: List of flag revisions used by this unit
      is_positional: false
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:flag_revision
      resource_method_params:
        unit.flagRevisions: '{__relative_name__}'
      required: false
      repeated: true
      clearable: true
    - arg_name: application
      api_field: unit.application
      required: false
      repeated: false
      clearable: true
      help_text: |-
        App Hub application that this unit belongs to. All resources deployed
        in this unit are associated with the specified application.
      ALPHA:
        help_text: |-
          Reference to the AppHub Application this unit belongs to.
          All resources deployed in this Unit will be associated with the specified
          Application.
    - arg_name: labels
      api_field: unit.labels
      required: false
      repeated: true
      help_text: |-
        Labels on the resource, which can be used for categorization, similar
        to Kubernetes resource labels.
      ALPHA:
        help_text: |-
          The labels on the resource, which can be used for categorization.
          similar to Kubernetes resource labels.
      clearable: true
      spec:
      - api_field: key
      - api_field: value
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.units
  update:
    read_modify_update: true
