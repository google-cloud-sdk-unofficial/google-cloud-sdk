- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: true
  help_text:
    brief: Describe a unit.
    description: |-
      Display the details of an App Lifecycle Manager unit.
    examples: |-
      To describe the unit named `my-unit` in location `us-central1`, run:

        $ {command} my-unit --location=us-central1

      To display only the state and current release of the unit named `my-unit`
      in location `us-central1`, run:

        $ {command} my-unit --location=us-central1 --format="yaml(state,release)"
  ALPHA:
    help_text:
      brief: Describe a Unit
      description: Describe a Unit
      examples: |-
        To describe the Unit, run:

        $ {command}
  arguments:
    params:
    - help_text: |-
        Unit to describe.
      ALPHA:
        help_text: Name of the resource
      is_positional: true
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:unit
      required: true
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.units
