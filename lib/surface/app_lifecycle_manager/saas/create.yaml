- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: false
  help_text:
    brief: Create a SaaS offering.
    description: |-
      Create an App Lifecycle Manager SaaS offering.

      A SaaS offering (also called an app offering) represents a SaaS product
      managed by the service producer. It defines the locations in which the
      product is available.
    examples: |-
      To create a SaaS offering named `my-saas` in location `us-central1` that
      is available in `us-central1`, run:

        $ {command} my-saas --location=us-central1 --locations=name=us-central1

      To create a SaaS offering named `my-saas` that is available in
      `us-central1` and `europe-west1` and has the label `env=prod`, run:

        $ {command} my-saas --location=us-central1 --locations=name=us-central1 --locations=name=europe-west1 --labels=env=prod
  ALPHA:
    help_text:
      brief: Create a SaaS
      description: Create a SaaS
      examples: |-
        To create a new SaaS, run:

        $ {command} saas --locations=name=us-central2 --locations=name=europe-west1
  arguments:
    params:
    - help_text: |-
        SaaS offering to create.
      ALPHA:
        help_text: |-
          Identifier. The resource name (full URI of the resource) following the standard naming
          scheme:

            "projects/{project}/locations/{location}/saas/{saas}"
      is_positional: true
      request_id_field: saasId
      resource_spec: !REF googlecloudsdk.command_lib.saas_runtime.resources:saas
      required: true
    - arg_name: locations
      api_field: saas.locations
      required: true
      repeated: true
      help_text: |-
        Locations in which the SaaS offering is available. Rollouts use this
        list to generate a rollout plan. Repeat the flag to specify multiple
        locations.
      ALPHA:
        help_text: |-
          List of locations that the service is available in. Rollout refers to the
          list to generate a rollout plan.
      spec:
      - api_field: name
        help_text: |-
          Name of the location.
        ALPHA:
          help_text: Name of location.
    - group:
        api_field: saas.applicationTemplate
        required: false
        help_text: |-
          Composite application template. Specify only in source regions;
          leave unspecified in replica regions. When specified, the template
          components are imported into their equivalent unit kind, release, and
          blueprint resources. Deleting the reference does not delete imported
          resources.
        ALPHA:
          help_text: |-
            CompositeRef represents a reference to a composite resource.
        params:
        - arg_name: application-template
          api_field: saas.applicationTemplate.applicationTemplate
          required: true
          repeated: false
          help_text: |-
            Full resource name of the Application Design Center composite
            application template to import.
          ALPHA:
            help_text: |-
              Reference to the ApplicationTemplate resource.
        - arg_name: application-template-revision
          api_field: saas.applicationTemplate.revision
          required: false
          repeated: false
          help_text: |-
            Revision of the application template to use. Changes to the revision
            trigger manual resynchronization. If empty, the application template
            is ignored.
          ALPHA:
            help_text: |-
              Revision of the ApplicationTemplate to use.
              Changes to revision will trigger manual resynchronization.
              If empty, ApplicationTemplate will be ignored.
    - arg_name: labels
      api_field: saas.labels
      required: false
      repeated: true
      help_text: |-
        Labels on the resource, which can be used for categorization, similar
        to Kubernetes resource labels.
      ALPHA:
        help_text: |-
          The labels on the resource, which can be used for categorization.
          similar to Kubernetes resource labels.
      spec:
      - api_field: key
      - api_field: value
  request:
    api_version: v1beta1
    GA:
      api_version: v1
    collection:
    - saasservicemgmt.projects.locations.saas
