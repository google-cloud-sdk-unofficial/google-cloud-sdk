- release_tracks: [GA]
  hidden: true

  help_text:
    brief: |
      Reconcile an Artifact Registry repository.
    description: |
      Reconcile an Artifact Registry repository.

      This command can fail for the following reasons:
        * The specified repository does not exist.
        * The active account does not have permission to reconcile repositories.
    examples: |
      To reconcile a repository named `my-repo` under the current project, run:

        $ {command} my-repo

  arguments:
    resource:
      spec: !REF googlecloudsdk.command_lib.artifacts.resources:repository_without_property
      help_text: |
        The Artifact Registry repository to reconcile.

  async:
    collection: artifactregistry.projects.locations.operations

  request:
    api_version: v1
    collection: artifactregistry.projects.locations.repositories
    method: reconcile
