- release_tracks: [ALPHA]
  hidden: true

  help_text:
    brief: List Secure Source Manager hooks under a repository.
    description: List Secure Source Manager hooks under a repository.
    examples: |
      To list hooks in repository ``my-repo'' and location ``us-central1'', run the following command:

      $ {command} --repository=my-repo --region=us-central1

  request:
    api_version: v1
    collection: securesourcemanager.projects.locations.repositories.hooks
    regional_endpoint_compatibility: SUPPORTED

  arguments:
    resource:
      help_text: The Secure Source Manager repository to list hooks for.
      spec: !REF googlecloudsdk.command_lib.source_manager.resources:repository
      arg_name: repository

  response:
    id_field: name

  output:
    format: |
      table(
        name.basename():label=HOOK_ID:sort=1,
        name.segment(3):label=LOCATION,
        targetUri:label=TARGET_URI,
        disabled.yesno(yes="True", no="False"):label=DISABLED,
        createTime.date()
      )
