- release_tracks: [ALPHA]
  hidden: true
  help_text:
    brief: List Secure Source Manager branch rules.
    description: |
      List Secure Source Manager branch rules in a repository.
    examples: |
      To list branch rules in repository ``my-repo'' and location ``us-central1'', run the following command:

        $ {command} --repository=my-repo --region=us-central1

  request:
    collection: securesourcemanager.projects.locations.repositories.branchRules
    api_version: v1
    regional_endpoint_compatibility: SUPPORTED

  response:
    id_field: name

  arguments:
    resource:
      help_text: The Secure Source Manager repository to list branch rules from.
      spec: !REF googlecloudsdk.command_lib.source_manager.resources:repository
