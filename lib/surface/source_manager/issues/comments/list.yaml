- release_tracks: [ALPHA]
  hidden: true

  help_text:
    brief: List Secure Source Manager comments under an issue.
    description: List Secure Source Manager comments under an issue.
    examples: |
      To list comments in issue ``123'' of repository ``my-repo'' and location ``us-central1'', run the following command:

      $ {command} --issue=123 --repository=my-repo --region=us-central1

  request:
    api_version: v1
    collection: securesourcemanager.projects.locations.repositories.issues.issueComments
    regional_endpoint_compatibility: SUPPORTED

  arguments:
    resource:
      help_text: The issue you want to list the comments for.
      spec: !REF googlecloudsdk.command_lib.source_manager.resources:issue
      arg_name: issue

  response:
    id_field: name

  output:
    format: |
      table(
        name.basename():label=COMMENT_ID:sort=1,
        name.segment(3):label=LOCATION,
        body:label=BODY,
        createTime.date()
      )
