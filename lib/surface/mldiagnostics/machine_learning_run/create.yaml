- release_tracks:
  - ALPHA
  auto_generated: false
  hints:
    read_only: false
  help_text:
    brief: Create a machine learning run
    description: Create a machine learning run.
    examples: |-
      To create the new machine learning run, run:

          $ {command} gcloud-cli-run-id-01 --orchestrator gke --run-group group-gcloud-cli
          --tools xprof --gcs-path gs://diagon-prod-data-bucket --display-name gcloud-cli-run
          --gke-cluster-name projects/PROJECT_ID/locations/us-central1/clusters/mldiag-prod-gke-cluster
          projects/PROJECT_ID/locations/us-central1/clusters/mldiag-prod-gke-cluster
          --gke-namespace diagon --gke-workload-name mldiag-prod-demo-jobset --gke-kind JobSet
          --gke-workload-create-time 2026-02-20T06:00:00Z --labels "created_by"="cli"
          --run-phase ACTIVE --auto-capture-enabled --auto-capture-default-duration 10s
          --auto-capture-type snapshot-over-on-demand
          --auto-capture-host-tracer-level host-tracer-level-info
          --auto-capture-device-tracer-level device-tracer-level-enabled
          --auto-capture-python-tracer-level python-tracer-level-disabled
          --auto-capture-max-session-count-per-event 5

          Sample output:
          ```
            Create request issued for: [gcloud-cli-run-id-01]
            Waiting for operation [projects/PROJECT_ID/locations/us-central1/operations/operation-1770308728284-64a161ee4640d-38e79884-425e56e2] to complete...done.
            Created machine_learning_run [gcloud-cli-run-id-01].
          ```

          If user want to list all the profiler session capture in Google Cloud Storage bucket (recursively), create a special machine learning run with a special lable `list_existing_sessions_only` as shown below:

          $ {command} gcloud-cli-run-id-02 --run-group group-gcloud-cli
          --gcs-path gs://diagon-prod-data-bucket/my-parent-directory --display-name gcloud-cli-run-02
          --labels "created_by"="cli" --labels "list_existing_sessions_only"="true"

          This will create a machine learning run in COMPLETED state without any workload
          details. User can navigate to the profiler list page to see all the
          profiler sessions captured under gs://diagon-prod-data-bucket/my-parent-directory (recursively).
          User can visualize any profiler session by passing the link and share it with others.
          No further update is possible for this machine learning run as it is marked as COMPLETED.

  arguments:
    params:
    - help_text: |-
        Identifier. The name of the Machine Learning run. If not provided, a random UUID will be generated.
      is_positional: true
      is_primary_resource: true
      request_id_field: machineLearningRunId
      resource_spec: !REF googlecloudsdk.command_lib.mldiagnostics.machine_learning_run.v1alpha_resources:projects_locations_machine_learning_runs
      required: true
    - arg_name: display-name
      api_field: machineLearningRun.displayName
      required: false
      repeated: false
      help_text: |-
        Display name for the run.
    - arg_name: run-group
      api_field: machineLearningRun.runGroup
      required: false
      default: ''
      repeated: false
      help_text: |-
        Allows grouping of similar runs.
         * Helps improve UI rendering performance.
         * Allows comparing similar runs via fast filters.
    - group:
        api_field: machineLearningRun.configs
        required: false
        help_text: |-
          Configuration for a Machine Learning run.
        params:
        - arg_name: configs-software
          api_field: machineLearningRun.configs.softwareConfigs
          required: false
          repeated: true
          help_text: |-
            Software configs.
          spec:
          - api_field: key
          - api_field: value
        - arg_name: configs-hardware
          api_field: machineLearningRun.configs.hardwareConfigs
          required: false
          repeated: true
          help_text: |-
            Hardware configs.
          spec:
          - api_field: key
          - api_field: value
    - arg_name: tools
      api_field: machineLearningRun.tools
      required: false
      default: xprof
      repeated: true
      help_text: |-
        List of tools enabled for this run. This is a repeated argument, and each instance
        configures one tool. If no tools are specified, XProf will be used by default by the service.

        To enable XProf without a specific session ID:
          `--tools=xprof`
        To enable XProf with a specific session ID:
          `--tools=xprof:sessionId=my-session-id`
        To enable multiple tools, repeat the argument:
          `--tools=xprof:sessionId=123 --tools=nsys`
      spec:
      - api_field: xprof
        one_of_index: 0
        help_text: |-
          Configuration for the XProf tool.
        spec:
        - api_field: sessionId
          help_text: |-
            The session ID for XProf.
            Example: `my-session-id`
    - arg_name: labels
      api_field: machineLearningRun.labels
      required: false
      repeated: true
      help_text: |-
        Any custom labels for this run
        Example: type:workload, type:simulation etc.
      spec:
      - api_field: key
      - api_field: value
    - group:
        api_field: machineLearningRun.artifacts
        required: false
        help_text: |-
          Represents information about the artifacts of the Machine Learning Run.
        params:
        - arg_name: gcs-path
          api_field: machineLearningRun.artifacts.gcsPath
          required: true
          repeated: false
          help_text: |-
            The Cloud Storage path where the artifacts of the run are stored.
            Example: `gs://my-bucket/my-run-directory`.
    - arg_name: orchestrator
      api_field: machineLearningRun.orchestrator
      required: false
      help_text: |-
        The orchestrator used for the run.
      choices:
      - arg_value: custom
        enum_value: CUSTOM
        help_text: |-
          Custom orchestrator with Single/Multiple Compute Engine instances.
      - arg_value: gke
        enum_value: GKE
        help_text: |-
          Google Kubernetes Engine orchestrator.
      - arg_value: slurm
        enum_value: SLURM
        help_text: |-
          Slurm cluster orchestrator.
    - group:
        api_field: machineLearningRun.workloadDetails
        required: false
        help_text: |-
          Workload details associated for the Machine Learning Run.
          Workload have different metadata based on the orchestrator like
          GKE cluster, Slurm cluster, Compute Engine instance etc.
        params:
        - group:
            mutex: true
            help_text: |-
              Arguments for the metadata.
            params:
            - group:
                api_field: machineLearningRun.workloadDetails.gke
                required: false
                help_text: |-
                  Workload details for the GKE orchestrator.
                params:
                - arg_name: gke-workload-name
                  api_field: machineLearningRun.workloadDetails.gke.id
                  required: false
                  repeated: false
                  help_text: |-
                    The identifier of the workload. Example - jobset-abcd
                - arg_name: gke-kind
                  api_field: machineLearningRun.workloadDetails.gke.kind
                  required: false
                  repeated: false
                  help_text: |-
                    The kind of the workload. Example - JobSet
                - arg_name: gke-cluster-name
                  api_field: machineLearningRun.workloadDetails.gke.cluster
                  required: false
                  repeated: false
                  help_text: |-
                    The cluster of the workload.
                    Example - /projects/<project id>/locations/<location>/clusters/<cluster
                    name>
                - arg_name: gke-namespace
                  api_field: machineLearningRun.workloadDetails.gke.namespace
                  required: false
                  repeated: false
                  help_text: |-
                    The namespace of the workload. Example - default
                - arg_name: gke-workload-create-time
                  api_field: machineLearningRun.workloadDetails.gke.createTime
                  required: false
                  repeated: false
                  help_text: |-
                    The create timestamp of the workload.
                    Example - 2026-02-20T06:00:00Z
            - group:
                api_field: machineLearningRun.workloadDetails.slurm
                required: false
                help_text: |-
                  Workload details for the Slurm orchestrator.
                params:
                - arg_name: slurm-job-id
                  api_field: machineLearningRun.workloadDetails.slurm.jobId
                  required: false
                  repeated: false
                  help_text: |-
                    The identifier of the slurm job. Example - 1234567890
                - arg_name: slurm-cluster-name
                  api_field: machineLearningRun.workloadDetails.slurm.cluster
                  required: false
                  repeated: false
                  help_text: |-
                    The cluster of the slurm job.
                    Example - /projects/<project id>/locations/<location>/clusters/<cluster
                    name>
                - arg_name: slurm-job-name
                  api_field: machineLearningRun.workloadDetails.slurm.displayName
                  required: false
                  repeated: false
                  help_text: |-
                    The display name of the slurm job (job_name). Example - training-workload
                - arg_name: slurm-job-submit-time
                  api_field: machineLearningRun.workloadDetails.slurm.submitTime
                  required: false
                  repeated: false
                  help_text: |-
                    The time when the slurm job was submitted. Example - 2026-02-20T06:00:00Z
            - group:
                api_field: machineLearningRun.workloadDetails.custom
                required: false
                help_text: |-
                  Workload details for workload running on custom orchestrator.
                params:
                - arg_name: custom-workload-id
                  api_field: machineLearningRun.workloadDetails.custom.id
                  required: true
                  repeated: false
                  help_text: |-
                    The identifier of the workload. Example - "1234567890"
                - arg_name: custom-workload-display-name
                  api_field: machineLearningRun.workloadDetails.custom.displayName
                  required: true
                  repeated: false
                  help_text: |-
                    The display name of the workload. Example - training-workload
                - arg_name: custom-workload-create-time
                  api_field: machineLearningRun.workloadDetails.custom.createTime
                  required: false
                  repeated: false
                  help_text: |-
                    The create timestamp of the workload. Example - 2026-02-20T06:00:00Z
        - arg_name: workload-targets
          api_field: machineLearningRun.workloadDetails.targets
          required: false
          repeated: true
          help_text: |-
            List of targets/hosts associated with the workload.
          spec:
          - api_field: displayName
            json_name: display-name
            help_text: |-
              Display name of the target/host.
          - api_field: instanceId
            json_name: instance-id
            help_text: |-
              Target identifier of the VM.
          - api_field: hostname
            help_text: |-
              Hostname of the VM.
          - api_field: zone
            help_text: |-
              Zone of the target, e.g., `us-central1-a`.
    - arg_name: run-phase
      api_field: machineLearningRun.runPhase
      required: false
      default: active
      help_text: |-
        RunPhase defines the phase of the run. This should be used only if non standard
        machine learning run needs to be created. If not specified, run phase will be set to active by default.
      choices:
      - arg_value: active
        enum_value: ACTIVE
        help_text: |-
          Run is active.
      - arg_value: completed
        enum_value: COMPLETED
        help_text: |-
          Run is completed.
      - arg_value: failed
        enum_value: FAILED
        help_text: |-
          Run is failed.
    - group:
        api_field: machineLearningRun.autoCaptureSettings
        required: false
        help_text: |-
          Configuration for auto-capturing profiler sessions upon degradation events.
        params:
        - arg_name: auto-capture-enabled
          api_field: machineLearningRun.autoCaptureSettings.enabled
          action: store_true
          required: false
          type: bool
          default: null
          help_text: |-
            Enable auto-capture for the Machine Learning Run. Defaults to false if not set.
        - arg_name: auto-capture-default-duration
          api_field: machineLearningRun.autoCaptureSettings.defaultDuration
          required: false
          repeated: false
          type: googlecloudsdk.core.util.times:ParseDuration
          processor: googlecloudsdk.core.util.times:FormatDurationForJson
          help_text: |-
            Default duration for on-demand profiler session during auto-capture.
            If not set, value of 10 seconds will be used by backend.
        - arg_name: auto-capture-type
          api_field: machineLearningRun.autoCaptureSettings.captureType
          required: false
          help_text: |-
            Capture type for profiler session.
          choices:
          - arg_value: snapshot-over-on-demand
            enum_value: SNAPSHOT_OVER_ON_DEMAND
            help_text: |-
              Capture snapshot first, if not possible then try to capture on-demand.
          - arg_value: on-demand-over-snapshot
            enum_value: ON_DEMAND_OVER_SNAPSHOT
            help_text: |-
              Capture on-demand, if not possible then try to capture snapshot.
          - arg_value: only-on-demand
            enum_value: ONLY_ON_DEMAND
            help_text: |-
              Capture only on-demand session.
          - arg_value: only-snapshot
            enum_value: ONLY_SNAPSHOT
            help_text: |-
              Capture only snapshot.
        - arg_name: auto-capture-default-profiler-targets
          api_field: machineLearningRun.autoCaptureSettings.defaultProfilerTargets
          required: false
          repeated: true
          type: str
          help_text: |-
            Targets actively being profiled. This will be used only if targets are not
            specified during capture request. If not set, all targets will be profiled.
            Format: projects/{project}/locations/{location}/machineLearningRuns/{machine_learning_run}/profilerTargets/{profiler_target}
        - arg_name: auto-capture-host-tracer-level
          api_field: machineLearningRun.autoCaptureSettings.hostTracerLevel
          required: false
          help_text: |-
            The host tracer level for the profiler session activity.
          choices:
          - arg_value: host-tracer-level-disabled
            enum_value: HOST_TRACER_LEVEL_DISABLED
            help_text: |-
              Tracer level is disabled.
          - arg_value: host-tracer-level-critical
            enum_value: HOST_TRACER_LEVEL_CRITICAL
            help_text: |-
              Tracer level is critical.
          - arg_value: host-tracer-level-info
            enum_value: HOST_TRACER_LEVEL_INFO
            help_text: |-
              Tracer level is info.
          - arg_value: host-tracer-level-verbose
            enum_value: HOST_TRACER_LEVEL_VERBOSE
            help_text: |-
              Tracer level is verbose.
        - arg_name: auto-capture-device-tracer-level
          api_field: machineLearningRun.autoCaptureSettings.deviceTracerLevel
          required: false
          help_text: |-
            The device tracer level for the profiler session activity.
          choices:
          - arg_value: device-tracer-level-disabled
            enum_value: DEVICE_TRACER_LEVEL_DISABLED
            help_text: |-
              Tracer level is disabled.
          - arg_value: device-tracer-level-enabled
            enum_value: DEVICE_TRACER_LEVEL_ENABLED
            help_text: |-
              Tracer level is enabled.
        - arg_name: auto-capture-python-tracer-level
          api_field: machineLearningRun.autoCaptureSettings.pythonTracerLevel
          required: false
          help_text: |-
            The python tracer level for the profiler session activity.
          choices:
          - arg_value: python-tracer-level-disabled
            enum_value: PYTHON_TRACER_LEVEL_DISABLED
            help_text: |-
              Tracer level is disabled.
          - arg_value: python-tracer-level-enabled
            enum_value: PYTHON_TRACER_LEVEL_ENABLED
            help_text: |-
              Tracer level is enabled.
        - arg_name: auto-capture-max-session-count-per-event
          api_field: machineLearningRun.autoCaptureSettings.maxSessionCountPerEvent
          required: false
          repeated: false
          type: int
          help_text: |-
            Max number of profiler sessions per monitored event.
            If not set, max of 500 sessions are allowed.
  request:
    api_version: v1alpha
    collection:
    - hypercomputecluster.projects.locations.machineLearningRuns
  async:
    collection:
    - hypercomputecluster.projects.locations.operations
