release_tracks: [ALPHA, BETA, GA]

help_text:
  brief: |
    Export an Agent Connectivity Template.
  description: |
    Export an Agent Connectivity Template.
  examples: |
    To export an Agent Connectivity Template named 'my-agent-connectivity-template' to a YAML file, run:

      $ {command} my-agent-connectivity-template --location=us-central1 --destination=my-agent-connectivity-template.yaml

request:
  collection: networkservices.projects.locations.agentConnectivityTemplates
  ALPHA:
    api_version: v1alpha1
  BETA:
    api_version: v1beta1
  GA:
    api_version: v1

arguments:
  resource:
    spec: !REF googlecloudsdk.command_lib.network_services.resources:agentConnectivityTemplate
    help_text: Name of the agent connectivity template to export.
