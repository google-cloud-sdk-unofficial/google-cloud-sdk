release_tracks: [ALPHA, BETA]

help_text:
  brief: |
    Describe an express link.
  description: Show details of an express link.
  examples: |
    Show details about an express link named "my-express-link".

      $ {command} my-express-link --location=global

arguments:
  resource:
    spec: !REF googlecloudsdk.command_lib.network_services.resources:expressLink
    help_text: Name of the express link to be described.

request: &request
  ALPHA:
    api_version: v1alpha1
  BETA:
    api_version: v1beta1
  collection: networkservices.projects.locations.expressLinks
