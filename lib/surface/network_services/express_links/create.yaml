release_tracks: [ALPHA, BETA]

help_text:
  brief: |
    Create an express link.
  description: |
    Create a new express link with the given name.
  examples: |
    Create an express link with the name "my-express-link" and location "global".

      $ {command} my-express-link --location=global

arguments:
  resource:
    spec: !REF googlecloudsdk.command_lib.network_services.resources:expressLink
    help_text: |
      Name of the express link to be created.
  params:
  - arg_name: description
    api_field: expressLink.description
    help_text: The description for the express link.
  - arg_name: source-services
    api_field: expressLink.source.services
    release_tracks: [ALPHA, BETA]
    help_text: |
      List of resources attached to the ExpressLink. The resources can be
      Cloud Run services.
    type: "googlecloudsdk.calliope.arg_parsers:ArgList:"
  - arg_name: destination-services
    api_field: expressLink.destination.services
    release_tracks: [ALPHA, BETA]
    help_text: |
      List of service URIs to which the ExpressLink resource is bound.
    type: "googlecloudsdk.calliope.arg_parsers:ArgList:"
  - arg_name: matches-hostname
    api_field: expressLink.matches
    release_tracks: [ALPHA, BETA]
    repeated: true
    type: "googlecloudsdk.calliope.arg_parsers:ArgList:"
    help_text: |
      List of hostnames to match against the HTTP request host header.
    ALPHA:
      processor: googlecloudsdk.command_lib.network_services.util:ExpressLinkMatchesHook:api_version=v1alpha1
    BETA:
      processor: googlecloudsdk.command_lib.network_services.util:ExpressLinkMatchesHook:api_version=v1beta1

async:
  collection: networkservices.projects.locations.operations

request: &request
  ALPHA:
    api_version: v1alpha1
  BETA:
    api_version: v1beta1
  collection: networkservices.projects.locations.expressLinks
  method: create
