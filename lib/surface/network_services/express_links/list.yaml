release_tracks: [ALPHA, BETA]

help_text:
  brief: |
    List express links.
  description: |
    List all express links in the specified location of the current project.
  examples: |
    To list all the global express links in the current project, run:

      $ {command} --location=global

request: &request
  ALPHA:
    api_version: v1alpha1
  BETA:
    api_version: v1beta1
  collection: networkservices.projects.locations.expressLinks

arguments:
  resource:
    spec: !REF googlecloudsdk.command_lib.network_services.resources:location
    help_text: |
      The project of the express links to display.

response:
  id_field: name

output:
  format: |
     table(
        name.basename():label=NAME
      )
