release_tracks: [ALPHA]

help_text:
  brief: |
    Import an express link.
  description: |
    Import an express link from a YAML file.
  examples: |
      To import an express link named `my-express-link` from a YAML file, run:

        $ {command} my-express-link --source=my-express-link.yaml --location=global

arguments:
  resource:
    spec: !REF googlecloudsdk.command_lib.network_services.resources:expressLink
    help_text: |
      Name of the express link to import.

async:
  collection: networkservices.projects.locations.operations

request:
  ALPHA:
    api_version: v1alpha1
  BETA:
    api_version: v1beta1
  collection: networkservices.projects.locations.expressLinks

import:
  abort_if_equivalent: true
  create_if_not_exists: true
  create_request:
    ALPHA:
      api_version: v1alpha1
    BETA:
      api_version: v1beta1
    method: create
    collection: networkservices.projects.locations.expressLinks
