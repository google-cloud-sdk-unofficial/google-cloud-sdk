- release_tracks: [ALPHA]
  help_text:
    brief: Update the Skill encryption spec of a location.
    description: |
      Set or change the Cloud KMS key that is used to encrypt Skills in a
      project and location.

      The Skill encryption spec can only be updated while no Skills exist in
      the project and location.
    examples: |
      To encrypt Skills in location `us-central1` with the Cloud KMS key
      `projects/my-project/locations/us-central1/keyRings/my-key-ring/cryptoKeys/my-key`,
      run:

        $ {command} --location=us-central1 --kms-key=projects/my-project/locations/us-central1/keyRings/my-key-ring/cryptoKeys/my-key

  request:
    api_version: v1alpha
    collection: agentregistry.projects.locations
    method: updateSkillEncryptionSpec
    display_resource_type: skill encryption spec
    regional_endpoint_compatibility: SUPPORTED
    modify_request_hooks:
    - googlecloudsdk.command_lib.agent_registry.util:SetSkillEncryptionSpecName

  arguments:
    resource:
      help_text: The location of the Skill encryption spec to update.
      spec: !REF googlecloudsdk.command_lib.agent_registry.resources:location
      is_positional: false
    params:
    - arg_name: kms-key
      api_field: skillEncryptionSpec.cryptoKeyName
      required: true
      help_text: |
        Resource name of the Cloud KMS key that is used to encrypt Skills in
        the location, in the format
        `projects/PROJECT_ID/locations/LOCATION/keyRings/KEY_RING/cryptoKeys/KEY`.

  async:
    api_version: v1alpha
    collection: agentregistry.projects.locations.operations
    extract_resource_result: false
    result_attribute: response
