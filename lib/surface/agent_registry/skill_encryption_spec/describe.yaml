- release_tracks: [ALPHA]
  help_text:
    brief: Describe the Skill encryption spec of a location.
    description: |
      Describe the Skill encryption spec of a project and location. The Skill
      encryption spec holds the Cloud KMS key that is used to encrypt Skills in
      the location.
    examples: |
      To describe the Skill encryption spec in location `us-central1`, run:

        $ {command} --location=us-central1

  request:
    api_version: v1alpha
    collection: agentregistry.projects.locations
    method: getSkillEncryptionSpec
    regional_endpoint_compatibility: SUPPORTED
    modify_request_hooks:
    - googlecloudsdk.command_lib.agent_registry.util:SetSkillEncryptionSpecName

  arguments:
    resource:
      help_text: The location of the Skill encryption spec to describe.
      spec: !REF googlecloudsdk.command_lib.agent_registry.resources:location
      is_positional: false
