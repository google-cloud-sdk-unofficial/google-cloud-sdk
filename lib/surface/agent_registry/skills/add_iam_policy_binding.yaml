- release_tracks: [ALPHA]
  help_text:
    brief: Add IAM policy binding for a skill.
    description: |
      Adds a policy binding to the IAM policy of a skill, given a
      skill ID and the binding. A binding consists of at least one member, a role, and
      an optional condition.
    examples: |
      To add an IAM policy binding for the role of `roles/agentregistry.viewer` for the user
      `test-user@gmail.com` on a skill `my-skill` in location `us-central1`, run:

        $ {command} my-skill --location=us-central1 --member='user:test-user@gmail.com' --role='roles/agentregistry.viewer'

  request:
    api_version: v1alpha
    collection: agentregistry.projects.locations.skills

  arguments:
    resource:
      help_text: The skill to add the IAM policy binding for.
      spec: !REF googlecloudsdk.command_lib.agent_registry.v1alpha_resources:projects_locations_skills

  iam:
    enable_condition: true
    policy_version: 3
    get_iam_policy_version_path: options_requestedPolicyVersion
    set_iam_policy_request_path: googleIamV1SetIamPolicyRequest
    message_type_overrides:
      policy: GoogleIamV1Policy
      binding: GoogleIamV1Binding
      condition: GoogleIamV1Expr
