    description: |-
      Create an AI Application in Agent Registry. An AI Application represents
      a logical grouping of agents, endpoints, and MCP servers serving a
      common business workload or use case, optionally configured with
      governance attributes like environment, criticality, and ownership contacts.
    examples: |-
      To create an AI Application 'my-app' in location 'global', run:

        $ {command} my-app \
            --location=global \
            --display-name="Customer Support App" \
            --description="AI Application orchestrating customer support agents"

      To create an AI Application with environment, criticality, and ownership contacts, run:

        $ {command} my-app \
            --location=global \
            --display-name="Customer Support App" \
            --environment-type=production \
            --criticality-type=high \
            --business-owners=biz-owner@example.com \
            --developer-owners=dev-owner@example.com \
            --operator-owners=ops-owner@example.com

      To create an AI Application asynchronously without waiting for the operation to finish, run:

