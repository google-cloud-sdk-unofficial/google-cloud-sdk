release_tracks: [ALPHA]
hidden: false
hints:
  read_only: true

help_text:
  brief: |
    Export a TokenBudgetPolicy resource.
  description: |
    Export a TokenBudgetPolicy resource to a YAML file.
  examples: |
    To export a TokenBudgetPolicy named `my-token-budget-policy` to a YAML file, run:

      $ {command} my-token-budget-policy --destination=my-token-budget-policy.yaml --location=global

request:
  collection: networksecurity.projects.locations.tokenBudgetPolicies
  ALPHA:
    api_version: v1alpha1

arguments:
  resource:
    spec: !REF googlecloudsdk.command_lib.network_security.v1alpha1_resources:projects_locations_token_budget_policies
    help_text: |
      Name of the TokenBudgetPolicy to export.
