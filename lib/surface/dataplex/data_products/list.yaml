- release_tracks: [ALPHA]
  help_text:
    brief: |
      List Dataplex Data Product resources.
    description: |
      List Dataplex Data Product resources under a project and location.
    examples: |
      To list Dataplex data products in location `us-central1` in project `test-project`, run:

          $ {command} --project=test-project --location=us-central1
  request:
    ALPHA:
      api_version: v1
    collection: dataplex.projects.locations.dataProducts
    method: list
  arguments:
    resource:
      help_text: |
        The location to list Dataplex Data Products in.
      spec: !REF googlecloudsdk.command_lib.dataplex.resources:location
