- release_tracks: [ALPHA, BETA, GA]
  is_python_command: true
  hints:
    read_only: false
  guidance:
    content: |
      ### Incremental updates
      Updates use a read-modify-write pattern: the command fetches the existing
      cluster configuration, applies the requested `--add-*`, `--update-*`, or
      `--remove-*` flag changes, and sends a patch request for only the modified
      fields so existing resources are not unintentionally overwritten.

      ### Using flags files
      Store reusable cluster update flags in a YAML or JSON file and pass
      `--flags-file=FILE` to apply repeatable modifications across clusters.
