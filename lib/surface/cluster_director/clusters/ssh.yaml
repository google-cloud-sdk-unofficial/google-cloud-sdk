- release_tracks: [ALPHA]
  is_python_command: true
  hints:
    read_only: false
  guidance:
    content: |
      ### Usage
      - Requires `--managed-instance-groups` (comma-separated list of Compute
        Engine Managed Instance Group IDs or resource names) and `--command` to
        specify the target instance groups and the remote command to execute.
      - Only supported on Managed Compute Clusters (clusters configured with a
        Compute Engine orchestrator).
      - Use `--batch-size` to limit the number of concurrent SSH connections per
        batch, and `--output-directory` to write per-instance stdout and stderr
        logs to disk.
