- release_tracks: [ALPHA, BETA, GA]
  hints:
    read_only: false
  help_text:
    brief: Imports a Cluster Director resource
    description: |
      Imports a Cluster Director resource configuration from a YAML file.
    examples: |-
      To import a cluster `my-cluster` in location `us-central1` from a YAML file, run:

        $ {command} my-cluster --location=us-central1 --source=cluster-config.yaml
  arguments:
    resource:
      spec: !REF googlecloudsdk.command_lib.cluster_director.clusters.resources:projects_locations_clusters
      help_text: |-
        Identifier. Name of the cluster to import.
        Format: cluster | projects/{project}/locations/{location}/clusters/{cluster}
  request:
    ALPHA:
      api_version: v1alpha
    BETA:
      api_version: v1beta
    GA:
      api_version: v1
    collection: hypercomputecluster.projects.locations.clusters
    regional_endpoint_compatibility: SUPPORTED
    modify_request_hooks:
    - googlecloudsdk.command_lib.cluster_director.clusters.utils:SetUpdateMask
  async:
    collection: hypercomputecluster.projects.locations.operations
  import:
    abort_if_equivalent: true
    create_if_not_exists: true
    create_request:
      ALPHA:
        api_version: v1alpha
      BETA:
        api_version: v1beta
      GA:
        api_version: v1
      collection: hypercomputecluster.projects.locations.clusters
      method: create
      regional_endpoint_compatibility: SUPPORTED
