- release_tracks: [ALPHA]

  # Omitted from tab completion and the public reference docs. Listed only in
  # the help for the pipelines group, which is itself hidden. API access is
  # restricted by the GCB_PIPELINES visibility label.
  hidden: true
  universe_compatible: true

  help_text:
    brief: Delete a Cloud Build pipeline.
    description: |
      Delete a Cloud Build pipeline.

      The pipeline must not have any triggers. Delete its triggers before you
      delete the pipeline; otherwise, the command fails with a
      `FAILED_PRECONDITION` error.
    examples: |
      To delete a pipeline named `main-pipeline` in region `us-central1`:

        $ {command} main-pipeline --region=us-central1

      To delete a pipeline without waiting for the operation to complete:

        $ {command} main-pipeline --region=us-central1 --async

  request:
    collection: cloudbuild.projects.locations.pipelines
    api_version: v1
    regional_endpoint_compatibility: SUPPORTED

  # Adds --async. When it is omitted the generator polls the returned
  # operation to completion instead of returning it directly.
  async:
    collection: cloudbuild.projects.locations.operations
    api_version: v1

  # TODO(b/567528950): `delete` does not yet support `--force`. `--force`
  # deletes child pipeline triggers and will be implemented once pipeline
  # triggers is completed.
  input:
    confirmation_prompt: |-
      You are about to delete pipeline [{__name__}] in region [{locationsId}].
      Any triggers on the pipeline must be deleted first, or the request fails.

  arguments:
    resource:
      help_text: The Cloud Build pipeline to delete.
      spec: !REF googlecloudsdk.command_lib.cloudbuild.resources:pipeline
      is_positional: true
