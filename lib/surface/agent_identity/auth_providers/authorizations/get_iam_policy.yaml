- release_tracks: [ALPHA, BETA]
  hints:
    read_only: true
  help_text:
    brief: Get the IAM policy for an Agent Identity authorization.
    description: |
      This command gets the IAM policy for an authorization.
    examples: |
      To print the IAM policy for a given authorization, run:

        $ {command} my-auth --auth-provider=my-auth-provider --location=LOCATION

  request:
    api_version: v1alpha
    collection: agentidentity.projects.locations.authProviders.authorizations
    regional_endpoint_compatibility: SUPPORTED

  arguments:
    resource:
      help_text: The authorization for which to display the IAM policy.
      is_positional: true
      spec: !REF googlecloudsdk.command_lib.agent_identity.authprovider_v1alpha_resources:projects_locations_auth_providers_authorizations
