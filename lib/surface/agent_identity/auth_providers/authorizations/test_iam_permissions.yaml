- release_tracks: [ALPHA, BETA]
  hints:
    read_only: true
  help_text:
    brief: Test IAM permissions for an Agent Identity authorization.
    description: |
      Returns permissions that a caller has on the specified resource.
    examples: |
      To test if the caller has 'agentidentity.authorizations.get' permission on an authorization, run:

        $ {command} my-auth --auth-provider=my-auth-provider --location=us-central1 --permissions=agentidentity.authorizations.get

  request:
    api_version: v1alpha
    collection: agentidentity.projects.locations.authProviders.authorizations
    method: testIamPermissions
    regional_endpoint_compatibility: SUPPORTED

  command_type: GENERIC

  arguments:
    resource:
      help_text: The authorization for which to test permissions.
      is_positional: true
      spec: !REF googlecloudsdk.command_lib.agent_identity.authprovider_v1alpha_resources:projects_locations_auth_providers_authorizations
    params:
    - arg_name: permissions
      api_field: testIamPermissionsRequest.permissions
      required: true
      repeated: true
      help_text: |-
        The permissions to test.
