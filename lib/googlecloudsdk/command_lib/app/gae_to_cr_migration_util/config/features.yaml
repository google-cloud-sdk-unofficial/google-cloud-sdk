---
unsupported:
- path:
    admin_api: inboundServices
    app_yaml: inbound_services
  severity: major
  reason: Cloud Run does not support GAE Inbound Services.
- path:
    admin_api: handlers
    app_yaml: handlers
  severity: major
  reason: Cloud Run does not support GAE Handlers.
- path:
    admin_api: errorHandlers
    app_yaml: error_handlers
  severity: major
  reason: Cloud Run does not support GAE Error Handlers.
- path:
    admin_api: appEngineApis
    app_yaml: app_engine_apis
  severity: major
  reason: Cloud Run does not support GAE Bundled Services.
- path:
    admin_api: resources.diskGb
    app_yaml: resources.disk_size_gb
  severity: minor
  reason: 'App Engine Flex defaults file writes to disk, whereas Cloud Run defaults to an in-memory file system (RAM). If your app needs to write to files without consuming memory, explicitly configure an ephemeral volume mount in Cloud Run to avoid Out-of-Memory (OOM) crashes in production. See: https://cloud.google.com/run/docs/configuring/services/ephemeral-disk'

range_limited:
- path:
    admin_api: resources.cpu
    app_yaml: resources.cpu
  range:
    max: 8
    min: 0
  severity: minor
  reason: Cloud Run supports CPU values between 0 to 8.
  flags:
  - --cpu
- path:
    admin_api: resources.memoryGb
    app_yaml: resources.memory_gb
  range:
    max: 32
    min: 0.5
  severity: minor
  reason: Cloud Run supports memory values between 0.5 to 32Gi.
  flags:
  - --memory
- path:
    admin_api: automaticScaling.standardSchedulerSettings.minInstances
    app_yaml: automatic_scaling.min_instances
  range:
    max: 1000
    min: 0
  severity: minor
  reason: Cloud Run supports automatic scaling min instances values between 0 to 1000.
  flags:
  - --min-instances
- path:
    admin_api: automaticScaling.standardSchedulerSettings.maxInstances
    app_yaml: automatic_scaling.max_instances
  range:
    max: 1000
    min: 0
  severity: minor
  reason: Cloud Run supports automatic scaling max instances values between 0 to 1000.
  flags:
  - --max-instances
- path:
    admin_api: manualScaling.instances
    app_yaml: manual_scaling.instances
  range:
    max: 1000
    min: 0
  severity: minor
  reason: Cloud Run supports manual scaling values between 0 and 1000.
  flags:
  - --min-instances
  - --max-instances
- path:
    admin_api: basicScaling.maxInstances
    app_yaml: basic_scaling.max_instances
  range:
    max: 1000
    min: 0
  severity: minor
  reason: Cloud Run only supports automatic scaling values between 0 and 1000.
  flags:
  - --max-instances
- path:
    admin_api: basicScaling.minInstances
    app_yaml: basic_scaling.min_instances
  range:
    max: 1000
    min: 0
  severity: minor
  reason: Cloud Run only supports automatic scaling values between 0 and 1000.
  flags:
  - --min-instances
- path:
    admin_api: automaticScaling.maxConcurrentRequests
    app_yaml: automatic_scaling.max_concurrent_requests
  range:
    max: 1000
    min: 1
  severity: minor
  reason: Cloud Run supports concurrency values between 1 and 1000.
  flags:
  - --concurrency
- path:
    admin_api: automaticScaling.targetConcurrentRequests
    app_yaml: automatic_scaling.target_concurrent_requests
  range:
    max: 1000
    min: 1
  severity: minor
  reason: Cloud Run supports concurrency values between 1 and 1000.
  flags:
  - --concurrency
value_limited:
- path:
    admin_api: runtimeConfig.pythonVersion
    app_yaml: runtime_config.python_version
  disallowed_values:
  - 2
  - '2'
  severity: major
  reason: Cloud Run only supports second generation App Engine runtimes. Older runtimes are not compatible.
- path:
    admin_api: runtime
    app_yaml: runtime
  disallowed_values:
  - java
  - java8
  - python
  - python27
  - php
  - php55
  - ruby
  - go
  - go111
  - nodejs
  severity: major
  reason: Cloud Run only supports second generation App Engine runtimes. Older runtimes are not compatible.
- path:
    admin_api: network.forwardedPorts
    app_yaml: network.forwarded_ports
  valid_format: ^\d+$
  severity: major
  reason: Cloud Run only supports simple container port values. Host ports and protocols are not supported.
supported:
- path:
    admin_api: entrypoint.shell
    app_yaml: entrypoint
  flags:
  - --command
- path:
    admin_api: envVariables
    app_yaml: env_variables
  flags:
  - --set-env-vars
- path:
    admin_api: vpcAccessConnector.name
    app_yaml: vpc_access_connector.name
  flags:
  - --vpc-connector
- path:
    admin_api: vpcAccessConnector.egressSetting
    app_yaml: vpc_access_connector.egress_setting
  flags:
  - --vpc-egress
- path:
    admin_api: serviceAccount
    app_yaml: service_account
  flags:
  - --service-account
- path:
    admin_api: network.name
    app_yaml: network.name
  flags:
  - --network
- path:
    admin_api: network.subnetworkName
    app_yaml: network.subnetwork_name
  flags:
  - --subnet
- path:
    admin_api: network.instanceTag
    app_yaml: network.instance_tag
  flags:
  - --network-tags
- path:
    admin_api: network.sessionAffinity
    app_yaml: network.session_affinity
  flags:
  - --session-affinity
- path:
    admin_api: network.forwardedPorts
    app_yaml: network.forwarded_ports
  flags:
  - --port
- path:
    admin_api: network.instanceIpMode
    app_yaml: network.instance_ip_mode
  flags:
  - --ingress
