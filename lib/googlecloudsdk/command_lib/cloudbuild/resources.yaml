project:
  name: project
  collection: cloudbuild.projects
  attributes:
  - &project
    parameter_name: projectId
    attribute_name: project
    help: Cloud Project ID
  disable_auto_completers: false

trigger:
  name: trigger
  collection: cloudbuild.projects.triggers
  attributes:
  - *project
  - &trigger
    parameter_name: triggerId
    attribute_name: trigger
    help: Build Trigger ID
  disable_auto_completers: false

build:
  name: build
  collection: cloudbuild.projects.builds
  attributes:
  - *project
  - &build
    parameter_name: id
    attribute_name: build
    help: Build ID
  disable_auto_completers: false

pipeline:
  name: pipeline
  collection: cloudbuild.projects.locations.pipelines
  attributes:
  - parameter_name: projectsId
    attribute_name: project
    help: Cloud Project ID
    property: core/project
  - parameter_name: locationsId
    attribute_name: region
    help: The Cloud location for the {resource}.
    property: builds/region
  - parameter_name: pipelinesId
    attribute_name: pipeline
    help: Pipeline ID
  disable_auto_completers: false
