# Resource specs for handwritten Agent Registry commands.

location:
  name: location
  collection: agentregistry.projects.locations
  attributes:
  - parameter_name: projectsId
    attribute_name: project
    help: The project ID of the {resource}.
    property: core/project
  - parameter_name: locationsId
    attribute_name: location
    help: The location ID of the {resource}.
  disable_auto_completers: true
