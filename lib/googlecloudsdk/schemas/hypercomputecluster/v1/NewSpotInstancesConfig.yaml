$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1 NewSpotInstancesConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- machineType
- zone
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  machineType:
    description: |-
      Immutable. Name of the Compute Engine [machine
      type](https://cloud.google.com/compute/docs/machine-resource) to use, e.g.
      `n2-standard-2`.
    type: string
  terminationAction:
    description: |-
      Termination action for the instance. If not specified, Compute Engine sets
      the termination action to DELETE.
    type: string
    enum:
    - DELETE
    - STOP
    - TERMINATION_ACTION_UNSPECIFIED
  zone:
    description: |-
      Immutable. Name of the zone in which VM instances should run, e.g., `us-
      central1-a`. Must be in the same region as the cluster, and must match the
      zone of any other resources specified in the cluster.
    type: string
