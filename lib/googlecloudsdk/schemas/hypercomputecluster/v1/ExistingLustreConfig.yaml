$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1 ExistingLustreConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- lustre
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  lustre:
    description: |-
      Immutable. Name of the Managed Lustre instance to import, in the format
      `projects/{project}/locations/{location}/instances/{instance}`
    type: string
