$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1 BootDisk export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  sizeGb:
    description: |-
      The size of the disk in gigabytes (GB), which must be at least 40 GB.
    type: integer
  type:
    description: |-
      [Persistent disk type](https://cloud.google.com/compute/docs/disks#disk-
      types), in the format
      `projects/{project}/zones/{zone}/diskTypes/{disk_type}`.
    type: string
