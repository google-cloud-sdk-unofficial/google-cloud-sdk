$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1 NewLustreConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- capacityGb
- filesystem
- lustre
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  capacityGb:
    description: |-
      Immutable. Storage capacity of the instance in gibibytes (GiB). Allowed
      values are between 18000 and 7632000.
    type: integer
  description:
    description: |-
      Immutable. Description of the Managed Lustre instance. Maximum of 2048
      characters.
    type: string
  filesystem:
    description: |-
      Immutable. Filesystem name for this instance. This name is used by client-
      side tools, including when mounting the instance. Must be 8 characters or
      less and can only contain letters and numbers.
    type: string
  lustre:
    description: |-
      Immutable. Name of the Managed Lustre instance to create, in the format
      `projects/{project}/locations/{location}/instances/{instance}`
    type: string
  perUnitStorageThroughput:
    description: |-
      Immutable. Throughput of the instance in MB/s/TiB. Valid values are 125,
      250, 500, 1000. See [Performance tiers and maximum storage
      capacities](https://cloud.google.com/managed- lustre/docs/create-
      instance#performance-tiers) for more information.
    type: integer
