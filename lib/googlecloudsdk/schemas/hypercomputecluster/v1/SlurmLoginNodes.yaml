$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1 SlurmLoginNodes export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- count
- machineType
- zone
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  bootDisk:
    description: Boot disk for the login node.
    $ref: BootDisk.yaml
  count:
    description: Number of login node instances to create.
    type: integer
  enableOsLogin:
    description: |-
      Whether [OS Login](https://cloud.google.com/compute/docs/oslogin) should
      be enabled on login node instances.
    type: boolean
  enablePublicIps:
    description: |-
      Whether login node instances should be assigned [external IP
      addresses](https://cloud.google.com/compute/docs/ip-
      addresses#externaladdresses).
    type: boolean
  labels:
    description: |-
      [Labels](https://cloud.google.com/compute/docs/labeling- resources) that
      should be applied to each login node instance.
    $ref: LabelsValue.yaml
  machineType:
    description: |-
      Name of the Compute Engine [machine
      type](https://cloud.google.com/compute/docs/machine-resource) to use for
      login nodes, e.g. `n2-standard-2`.
    type: string
  startupScript:
    description: |-
      [Startup script](https://cloud.google.com/compute/docs/instances/startup-
      scripts/linux) to be run on each login node instance. Max 256KB. The
      script must complete within the system-defined default timeout of 5
      minutes. For tasks that require more time, consider running them in the
      background using methods such as `&` or `nohup`.
    type: string
  storageConfigs:
    description: How storage resources should be mounted on each login node.
    type: array
    items:
      $ref: StorageConfig.yaml
  zone:
    description: |-
      Name of the zone in which login nodes should run, e.g., `us-
      central1-a`. Must be in the same region as the cluster, and must match
      the zone of any other resources specified in the cluster.
    type: string
