$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1 StorageResource export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- config
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  config:
    description: |-
      Immutable. Configuration for this storage resource, which describes how it
      should be created or imported. This field only controls how the storage
      resource is initially created or imported. Subsequent changes to the
      storage resource should be made via the resource's API and will not be
      reflected in the configuration.
    $ref: StorageResourceConfig.yaml
