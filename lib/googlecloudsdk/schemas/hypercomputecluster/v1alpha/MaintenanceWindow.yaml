$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1alpha MaintenanceWindow export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- day
- duration
- startTime
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  day:
    description: Day of the week on which maintenance may be performed.
    type: string
    enum:
    - DAY_OF_WEEK_UNSPECIFIED
    - FRIDAY
    - MONDAY
    - SATURDAY
    - SUNDAY
    - THURSDAY
    - TUESDAY
    - WEDNESDAY
  duration:
    description: |-
      Duration of the maintenance window. The system will attempt to complete
      maintenance within this duration from start_time. Must be between 4 and 24
      hours.
    type: string
  startTime:
    description: |-
      Time in UTC during the given day when the system is allowed to start
      performing maintenance.
    $ref: TimeOfDay.yaml
