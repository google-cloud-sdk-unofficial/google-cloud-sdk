$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1alpha NewBucketConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- bucket
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  autoclass:
    description: |-
      Immutable. If set, indicates that the bucket should use
      [Autoclass](https://cloud.google.com/storage/docs/autoclass).
    $ref: GcsAutoclassConfig.yaml
  bucket:
    description: Immutable. Name of the Cloud Storage bucket to create.
    type: string
  hierarchicalNamespace:
    description: |-
      Immutable. If set, indicates that the bucket should use [hierarchical
      namespaces](https://cloud.google.com/storage/docs/hns-overview).
    $ref: GcsHierarchicalNamespaceConfig.yaml
  storageClass:
    description: |-
      Immutable. If set, uses the provided storage class as the bucket's default
      storage class.
    type: string
    enum:
    - ARCHIVE
    - COLDLINE
    - NEARLINE
    - RAPID
    - STANDARD
    - STORAGE_CLASS_UNSPECIFIED
