$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1alpha ResourcePolicyConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  acceleratorTopology:
    description: |-
      Specifies the topology required to create a partition for VMs that have
      interconnected accelerators, in the format `AxB` or `AxBxC`, where `A`,
      `B`, and `C` are integers.
    type: string
