$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1alpha StorageConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- id
- localMount
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  id:
    description: |-
      ID of the storage resource to mount, which must match a key in the
      cluster's storage_resources.
    type: string
  localMount:
    description: |-
      A directory inside the VM instance's file system where the storage
      resource should be mounted (e.g., `/mnt/share`).
    type: string
