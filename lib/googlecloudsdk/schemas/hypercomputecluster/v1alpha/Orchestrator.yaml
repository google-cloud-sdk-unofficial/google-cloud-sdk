$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1alpha Orchestrator export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  computeEngine:
    description: |-
      If set, indicates that the cluster should use Compute Engine as the
      orchestrator.
    $ref: ComputeEngineOrchestrator.yaml
  existingContainerCluster:
    description: |-
      If set, indicates that the cluster should use an existing container
      cluster as the orchestrator.
    $ref: ExistingContainerClusterOrchestrator.yaml
  slurm:
    description: |-
      If set, indicates that the cluster should use Slurm as the orchestrator.
    $ref: SlurmOrchestrator.yaml
