$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1alpha Disk export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  existingDisk:
    description: |-
      An existing persistent disk to attach read-only to all VMs in the managed
      instance group, in the format
      `projects/{project}/zones/{zone}/disks/{disk}`.
    type: string
  image:
    description: Source image for the disk.
    type: string
  sizeGb:
    description: |-
      Size of the disk in GB. This field is required when creating a new disk.
    type: integer
  snapshot:
    description: Source snapshot for the disk.
    type: string
  type:
    description: |-
      [Persistent disk type](https://cloud.google.com/compute/docs/disks#disk-
      types), in the format
      `projects/{project}/zones/{zone}/diskTypes/{disk_type}`. This field is
      required when creating a new disk.
    type: string
