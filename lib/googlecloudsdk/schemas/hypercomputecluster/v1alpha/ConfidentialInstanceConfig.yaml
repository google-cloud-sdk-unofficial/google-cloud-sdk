$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1alpha ConfidentialInstanceConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- confidentialInstanceType
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  confidentialInstanceType:
    description: |-
      Immutable. The Trusted Execution Environment technology to use. Must be
      supported by the machine type of the compute resource.
    type: string
    enum:
    - CONFIDENTIAL_INSTANCE_TYPE_UNSPECIFIED
    - SEV
    - SEV_SNP
    - TDX
