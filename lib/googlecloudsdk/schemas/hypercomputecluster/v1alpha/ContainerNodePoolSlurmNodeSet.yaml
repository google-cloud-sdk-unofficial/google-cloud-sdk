$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1alpha ContainerNodePoolSlurmNodeSet export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  resourceLabels:
    description: |-
      Resource labels that are applied to the underlying Google Compute Engine
      resources.
    $ref: ResourceLabelsValue.yaml
  startupScript:
    description: |-
      Script to run in each pod in the nodeset when it first starts. Max 256KB.
    type: string
