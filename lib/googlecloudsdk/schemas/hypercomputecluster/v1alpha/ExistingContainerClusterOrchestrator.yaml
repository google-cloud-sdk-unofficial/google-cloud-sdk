$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1alpha ExistingContainerClusterOrchestrator export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- cluster
- kubernetesNamespace
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  cluster:
    description: Immutable. Resource reference to the GKE cluster.
    type: string
  kubernetesNamespace:
    description: Immutable. The Kubernetes namespace to monitor.
    type: string
