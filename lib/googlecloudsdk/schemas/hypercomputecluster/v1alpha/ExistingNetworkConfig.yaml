$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1alpha ExistingNetworkConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- network
- subnetwork
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  network:
    description: |-
      Immutable. Name of the network to import, in the format
      `projects/{project}/global/networks/{network}`.
    type: string
  subnetwork:
    description: |-
      Immutable. Particular subnetwork to use, in the format
      `projects/{project}/regions/{region}/subnetworks/{subnetwork}`.
    type: string
