$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1beta ComputeResource export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- config
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  config:
    description: |-
      Immutable. Configuration for this compute resource, which describes how it
      should be created at runtime.
    $ref: ComputeResourceConfig.yaml
