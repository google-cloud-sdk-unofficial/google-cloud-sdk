$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1beta NewNetworkConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- network
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  description:
    description: |-
      Immutable. Description of the network. Maximum of 2048 characters.
    type: string
  network:
    description: |-
      Immutable. Name of the network to create, in the format
      `projects/{project}/global/networks/{network}`.
    type: string
