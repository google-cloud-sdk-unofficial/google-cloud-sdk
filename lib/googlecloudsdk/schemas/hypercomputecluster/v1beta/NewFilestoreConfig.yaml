$schema: "http://json-schema.org/draft-06/schema#"

title: hypercomputecluster v1beta NewFilestoreConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- fileShares
- filestore
- tier
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  description:
    description: |-
      Immutable. Description of the instance. Maximum of 2048 characters.
    type: string
  fileShares:
    description: |-
      Immutable. File system shares on the instance. Exactly one file share must
      be specified.
    type: array
    items:
      $ref: FileShareConfig.yaml
  filestore:
    description: |-
      Immutable. Name of the Filestore instance to create, in the format
      `projects/{project}/locations/{location}/instances/{instance}`.
    type: string
  protocol:
    description: |-
      Immutable. Access protocol to use for all file shares in the instance.
      Defaults to NFS V3 if not set.
    type: string
    enum:
    - NFSV3
    - NFSV41
    - PROTOCOL_UNSPECIFIED
  tier:
    description: Immutable. Service tier to use for the instance.
    type: string
    enum:
    - REGIONAL
    - TIER_UNSPECIFIED
    - ZONAL
