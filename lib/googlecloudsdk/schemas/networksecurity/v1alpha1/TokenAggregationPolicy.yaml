$schema: "http://json-schema.org/draft-06/schema#"

title: networksecurity v1alpha1 TokenAggregationPolicy export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- rules
- target
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  description:
    description: Human-readable description of the policy.
    type: string
  labels:
    description: User-defined labels for the resource.
    $ref: LabelsValue.yaml
  name:
    description: |-
      Identifier. The canonical resource name of the TokenAggregationPolicy.
      Format: `projects/{project}/locations/{location}
      /tokenAggregationPolicies/{token_aggregation_policy}`
    type: string
  rules:
    description: |-
      Ordered list of aggregation rules. Evaluated in order; first match wins.
    type: array
    items:
      $ref: TokenAggregationRule.yaml
  target:
    description: Data plane target to which this policy is attached.
    $ref: TokenAggregationPolicyTarget.yaml
