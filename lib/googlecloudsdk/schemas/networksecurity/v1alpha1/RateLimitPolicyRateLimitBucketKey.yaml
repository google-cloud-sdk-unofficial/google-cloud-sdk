$schema: "http://json-schema.org/draft-06/schema#"

title: networksecurity v1alpha1 RateLimitPolicyRateLimitBucketKey export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- keyType
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  header:
    description: Specifies the header name if key_type is HTTP_HEADER.
    type: string
  keyType:
    description: Specifies the type of key to use for rate limiting.
    type: string
    enum:
    - ALL
    - HTTP_HEADER
    - HTTP_PATH
    - KEY_TYPE_UNSPECIFIED
    - MCP_TOOL
    - PRINCIPAL
    - SOURCE_IP
  principalType:
    description: Specifies the principal type if key_type is PRINCIPAL.
    type: string
    enum:
    - CLIENT_CERT_COMMON_NAME
    - PRINCIPAL_TYPE_UNSPECIFIED
