$schema: "http://json-schema.org/draft-06/schema#"

title: compute preview BackendBucket export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  bucketName:
    description: Cloud Storage bucket name.
    type: string
  cdnPolicy:
    description: Cloud CDN configuration for this BackendBucket.
    $ref: BackendBucketCdnPolicy.yaml
  compressionMode:
    description: |-
      Compress text responses using Brotli or gzip compression, based on the
      client's Accept-Encoding header.
    type: string
    enum:
    - AUTOMATIC
    - DISABLED
  customResponseHeaders:
    description: |-
      Headers that the Application Load Balancer should add to proxied
      responses.
    type: array
    items:
      type: string
  description:
    description: |-
      An optional textual description of the resource; provided by the
      client when the resource is created.
    type: string
  enableCdn:
    description: If true, enable Cloud CDN for this BackendBucket.
    type: boolean
  loadBalancingScheme:
    description: |-
      The value can only be INTERNAL_MANAGED for cross- region internal
      layer 7 load balancer.  If loadBalancingScheme is not specified, the
      backend bucket can be used by classic global external load balancers,
      or global application external load balancers, or both.
    type: string
    enum:
    - EXTERNAL_MANAGED
    - INTERNAL_MANAGED
  name:
    description: |-
      Name of the resource. Provided by the client when the resource is
      created. The name must be 1-63 characters long, and comply
      withRFC1035. Specifically, the name must be 1-63 characters long and
      match the regular expression `[a-z]([-a-z0-9]*[a-z0-9])?` which means
      the first character must be a lowercase letter, and all following
      characters must be a dash, lowercase letter, or digit, except the last
      character, which cannot be a dash.
    type: string
  params:
    description: |-
      Input only. [Input Only] Additional params passed with the request,
      but not persisted as part of resource payload.
    $ref: BackendBucketParams.yaml
