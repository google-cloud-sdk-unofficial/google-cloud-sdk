$schema: "http://json-schema.org/draft-06/schema#"

title: compute preview HaController export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  backendServices:
    description: |-
      Advanced configuration option. If specified, these Backend Services need
      to be pre-created.  Currently, only one backend service can be specified,
      and it must be L4 Internal Load Balancer (ILB).
    type: array
    items:
      type: string
  description:
    description: |-
      An optional description of this resource. Provide this property when
      you create the resource.
    type: string
  failoverInitiation:
    description: Indicates how failover should be initiated.
    type: string
    enum:
    - AUTOMATIC
    - FAILOVER_INITIATION_UNSPECIFIED
    - MANUAL_ONLY
  instanceName:
    description: |-
      Name of the instance that HaController is in charge of. If not
      specified the HaController's resource name will be used instead. The
      name must be 1-63 characters long, and comply withRFC1035.
      Specifically, the name must be 1-63 characters long and match the
      regular expression `[a-z]([-a-z0-9]*[a-z0-9])?` which means the first
      character must be a lowercase letter, and all following characters
      must be a dash, lowercase letter, or digit, except the last character,
      which cannot be a dash.
    type: string
  name:
    description: |-
      Name of the resource. Provided by the client when the resource is
      created. The name must be 1-63 characters long, and comply
      withRFC1035. Specifically, the name must be 1-63 characters long and
      match the regular expression `[a-z]([-a-z0-9]*[a-z0-9])?` which means
      the first character must be a lowercase letter, and all following
      characters must be a dash, lowercase letter, or digit, except the last
      character, which cannot be a dash.
    type: string
  networkingAutoConfiguration:
    description: |-
      Basic networking configuration. Required backend services and
      forwarding rules will be automatically created with default
      parameters.
    $ref: HaControllerNetworkingAutoConfiguration.yaml
  params:
    description: |-
      Input only. Additional parameters passed with the request, but not
      persisted as part of the resource. Both `params: null` and `params:
      {}` are treated identically as a no-op.
    $ref: HaControllerParams.yaml
  zoneConfigurations:
    description: 'Map of zone configurations Key: name of the zone'
    $ref: ZoneConfigurationsValue.yaml
