$schema: "http://json-schema.org/draft-06/schema#"

title: compute preview TargetTcpProxy export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  description:
    description: |-
      An optional description of this resource. Provide this property when you
      create the resource.
    type: string
  loadBalancingScheme:
    description: |-
      Specifies the type of load balancing scheme used by this target proxy.
    type: string
    enum:
    - EXTERNAL
    - EXTERNAL_MANAGED
    - INTERNAL_MANAGED
    - LOAD_BALANCING_SCHEME_UNSPECIFIED
  name:
    description: |-
      Name of the resource. Provided by the client when the resource is created.
      The name must be 1-63 characters long, and comply withRFC1035.
      Specifically, the name must be 1-63 characters long and match the regular
      expression `[a-z]([-a-z0-9]*[a-z0-9])?` which means the first character
      must be a lowercase letter, and all following characters must be a dash,
      lowercase letter, or digit, except the last character, which cannot be a
      dash.
    type: string
  proxyBind:
    description: |-
      This field only applies when the forwarding rule that references this
      target proxy has a loadBalancingScheme set toINTERNAL_SELF_MANAGED.  When
      this field is set to true, Envoy proxies set up inbound traffic
      interception and bind to the IP address and port specified in the
      forwarding rule. This is generally useful when using Traffic Director to
      configure Envoy as a gateway or middle proxy (in other words, not a
      sidecar proxy). The Envoy proxy listens for inbound requests and handles
      requests when it receives them.  The default is false.
    type: boolean
  proxyHeader:
    description: |-
      Specifies the type of proxy header to append before sending data to the
      backend, either NONE or PROXY_V1. The default is NONE.
    type: string
    enum:
    - NONE
    - PROXY_V1
  service:
    description: URL to the BackendService resource.
    type: string
