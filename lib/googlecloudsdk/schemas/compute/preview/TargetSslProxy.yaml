$schema: "http://json-schema.org/draft-06/schema#"

title: compute preview TargetSslProxy export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  certificateMap:
    description: |-
      URL of a certificate map that identifies a certificate map associated with
      the given target proxy. This field can only be set for global target
      proxies. If set, sslCertificates will be ignored. Accepted format
      is//certificatemanager.googleapis.com/projects/{project}
      /locations/{location}/certificateMaps/{resourceName}.
    type: string
  description:
    description: |-
      An optional description of this resource. Provide this property when you
      create the resource.
    type: string
  name:
    description: |-
      Name of the resource. Provided by the client when the resource is created.
      The name must be 1-63 characters long, and comply withRFC1035.
      Specifically, the name must be 1-63 characters long and match the regular
      expression `[a-z]([-a-z0-9]*[a-z0-9])?` which means the first character
      must be a lowercase letter, and all following characters must be a dash,
      lowercase letter, or digit, except the last character, which cannot be a
      dash.
    type: string
  proxyHeader:
    description: |-
      Specifies the type of proxy header to append before sending data to the
      backend, either NONE or PROXY_V1. The default is NONE.
    type: string
    enum:
    - NONE
    - PROXY_V1
  service:
    description: URL to the BackendService resource.
    type: string
  sslCertificates:
    description: |-
      URLs to SslCertificate resources that are used to authenticate connections
      to Backends. At least one SSL certificate must be specified. Currently,
      you may specify up to 15 SSL certificates. sslCertificates do not apply
      when the load balancing scheme is set to INTERNAL_SELF_MANAGED.
    type: array
    items:
      type: string
  sslPolicy:
    description: |-
      URL of SslPolicy resource that will be associated with the
      TargetSslProxy resource. If not set, the TargetSslProxy resource will
      not have any SSL policy configured.
    type: string
