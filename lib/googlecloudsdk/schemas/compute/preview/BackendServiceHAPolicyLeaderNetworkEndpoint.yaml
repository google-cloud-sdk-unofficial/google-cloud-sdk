$schema: "http://json-schema.org/draft-06/schema#"

title: compute preview BackendServiceHAPolicyLeaderNetworkEndpoint export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  instance:
    description: |-
      The name of the VM instance of the leader network endpoint. The instance
      must already be attached to the NEG specified in the
      haPolicy.leader.backendGroup.  The value must be a valid RFC1035 name
      (1-63 characters) or a valid instance URL. Authorization requires the
      following IAM permission on the specified resource instance:
      compute.instances.use
    type: string
