$schema: "http://json-schema.org/draft-06/schema#"

title: compute preview CustomErrorResponsePolicy export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  errorResponseRules:
    description: |-
      Specifies rules for returning error responses.  In a given policy, if you
      specify rules for both a range of error codes as well as rules for
      specific error codes then rules with specific error codes have a higher
      priority. For example, assume that you configure a rule for 401 (Un-
      authorized) code, and another for all 4 series error codes (4XX). If the
      backend service returns a401, then the rule for 401 will be applied.
      However if the backend service returns a 403, the rule for4xx takes
      effect.
    type: array
    items:
      $ref: CustomErrorResponsePolicyCustomErrorResponseRule.yaml
  errorService:
    description: |-
      The full or partial URL to the BackendBucket resource that contains
      the custom error content. Examples are:              - https:// www.go
      ogleapis.com/compute/v1/projects/project/global/backendBuckets/myB
      ackendBucket      -
      compute/v1/projects/project/global/backendBuckets/myBackendBucket
      - global/backendBuckets/myBackendBucket  If errorService is not
      specified at lower levels likepathMatcher, pathRule and routeRule, an
      errorService specified at a higher level in theUrlMap will be used.
      IfUrlMap.defaultCustomErrorResponsePolicy contains one or
      moreerrorResponseRules[], it must specifyerrorService.   If load
      balancer cannot reach the backendBucket, a simple Not Found Error will
      be returned, with the original response code (oroverrideResponseCode
      if configured).  errorService is not supported for internal or
      regionalHTTP/HTTPS load balancers.
    type: string
