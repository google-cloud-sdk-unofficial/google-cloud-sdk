$schema: "http://json-schema.org/draft-06/schema#"

title: compute preview UrlMapTest export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  description:
    description: Description of this test case.
    type: string
  expectedOutputUrl:
    description: |-
      The expected output URL evaluated by the load balancer containing the
      scheme, host, path and query parameters.  For rules that forward requests
      to backends, the test passes only whenexpectedOutputUrl matches the
      request forwarded by the load balancer to backends. For rules with
      urlRewrite, the test verifies that the forwarded request
      matcheshostRewrite and pathPrefixRewrite in theurlRewrite action. When
      service is specified,expectedOutputUrl`s scheme is ignored.  For rules
      with urlRedirect, the test passes only ifexpectedOutputUrl matches the URL
      in the load balancer's redirect response. If urlRedirect
      specifieshttps_redirect, the test passes only if the scheme
      inexpectedOutputUrl is also set to HTTPS. If urlRedirect specifies
      strip_query, the test passes only if expectedOutputUrl does not contain
      any query parameters.   expectedOutputUrl is optional whenservice is
      specified.
    type: string
  expectedRedirectResponseCode:
    description: |-
      For rules with urlRedirect, the test passes only
      ifexpectedRedirectResponseCode matches the HTTP status code in load
      balancer's redirect response.  expectedRedirectResponseCode cannot be set
      whenservice is set.
    type: integer
  headers:
    description: |-
      HTTP headers for this request. If headers contains a host header, then
      host must also match the header value.
    type: array
    items:
      $ref: UrlMapTestHeader.yaml
  host:
    description: |-
      Host portion of the URL. If headers contains a host header, then host
      must also match the header value.
    type: string
  path:
    description: Path portion of the URL.
    type: string
  service:
    description: |-
      Expected BackendService or BackendBucket resource the given URL should
      be mapped to.   The service field cannot be set if
      expectedRedirectResponseCode is set.
    type: string
