$schema: "http://json-schema.org/draft-06/schema#"

title: compute alpha ServiceIntegrationSpecBackupDRSpec export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  plan:
    description: |-
      The BackupPlan resource to attach to the instance. Specified as a resource
      reference in instances, and regional instance templates, and as just the
      plan name in global instance templates
    type: string
