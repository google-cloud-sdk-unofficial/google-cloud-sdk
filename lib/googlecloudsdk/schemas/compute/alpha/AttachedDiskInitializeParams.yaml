$schema: "http://json-schema.org/draft-06/schema#"

title: compute alpha AttachedDiskInitializeParams export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  architecture:
    description: |-
      The architecture of the attached disk. Valid values are arm64 or x86_64.
    type: string
    enum:
    - ARCHITECTURE_UNSPECIFIED
    - ARM64
    - X86_64
  description:
    description: |-
      An optional description. Provide this property when creating the disk.
    type: string
  diskName:
    description: |-
      Specifies the disk name. If not specified, the default is to use the name
      of the instance. If a disk with the same name already exists in the given
      region, the existing disk is attached to the new instance and the new disk
      is not created.
    type: string
  diskSizeGb:
    description: |-
      Specifies the size of the disk in base-2 GB. The size must be at least 10
      GB. If you specify a sourceImage, which is required for boot disks, the
      default size is the size of the sourceImage. If you do not specify a
      sourceImage, the default disk size is 500 GB.
    type: integer
  diskType:
    description: |-
      Specifies the disk type used for the boot disk or an additional data disk.
      For valid disk type values, see  Supported types for Hyperdisk volumes and
      Persistent Disk type variables.  When creating a single instance, you must
      provide either the full or partial URL of the disk type. For example, the
      following values are valid:               -
      https://www.googleapis.com/compute/v1/projects/project/zones/zone/diskTy
      pes/diskType      - projects/project/zones/zone/diskTypes/diskType -
      zones/zone/diskTypes/diskType    When creating an instance template,
      instance flexibility policy, or when creating or updating an all-
      instances configuration, you specify the disk type without a URL, for
      example, hyperdisk-balanced.  If you omit this field for a disk, the
      default disk type depends on the instance's machine series, as follows. -
      For first- and second-generation machine series like N1, N2, T2, and M1,
      the        default disk type is Standard Persistent Disk        (pd-
      standard).     - For C3, C3D, and M3 the default is Balanced Persistent
      Disk     (pd-balanced).     - For other third-generation machine series
      like A3, H3, Z3, all         fourth-generation types like C4, N4, M4, and
      newer machine series,         the default is Hyperdisk Balanced
      (hyperdisk-balanced).    The disk type you specify must be compatible with
      the instance's machine series. For a list of machine series that support
      Persistent Disk, see Machine series support for Persistent Disk. For a
      list of machine series that support Hyperdisk, seeMachine series support
      for Hyperdisk.
    type: string
  enableConfidentialCompute:
    description: Whether this disk is using confidential compute mode.
    type: boolean
  guestOsFeatures:
    description: |-
      A list of features to enable on the guest operating system. Applicable
      only for bootable images. Read Enabling guest operating system features to
      see a list of available options.  Guest OS features are applied by
      merginginitializeParams.guestOsFeatures anddisks.guestOsFeatures
    type: array
    items:
      $ref: GuestOsFeature.yaml
  interface:
    description: |-
      [Deprecated] Specifies the disk interface to use for attaching this
      disk, which is either SCSI or NVME. The default isSCSI.
    type: string
    enum:
    - NVME
    - SCSI
    - UNSPECIFIED
  labels:
    description: |-
      Labels to apply to this disk. These can be later modified by
      thedisks.setLabels method. This field is only applicable for
      persistent disks.
    $ref: LabelsValue.yaml
  licenseCodes:
    description: |-
      Integer license codes indicating which licenses are attached to this
      disk.
    type: array
    items:
      type: integer
  licenses:
    description: |-
      A list of publicly visible licenses. Reserved for Google's use.
    type: array
    items:
      type: string
  multiWriter:
    description: |-
      Indicates whether or not the disk can be read/write attached
      to more than one instance.
    type: boolean
  onUpdateAction:
    description: |-
      Specifies which action to take on instance update with this
      disk. Default is to use the existing disk.
    type: string
    enum:
    - RECREATE_DISK
    - RECREATE_DISK_IF_SOURCE_CHANGED
    - USE_EXISTING_DISK
  provisionedIops:
    description: |-
      Indicates how many IOPS to provision for the disk. This sets
      the number of I/O operations per second that the disk can
      handle. Values must be between 10,000 and 120,000. For more
      details, see theExtreme persistent disk documentation.
    type: integer
  provisionedThroughput:
    description: |-
      Indicates how much throughput to provision for the disk. This
      sets the number of throughput mb per second that the disk can
      handle. Values must greater than or equal to 1.
    type: integer
  replicaZones:
    description: |-
      Required for each regional disk associated with the instance.
      Specify the URLs of the zones where the disk should be
      replicated to. You must provide exactly two replica zones, and
      one zone must be the same as the instance zone.
    type: array
    items:
      type: string
  resourceManagerTags:
    description: |-
      Input only. Resource manager tags to be bound to the disk.
      Tag keys and values have the same definition as resource
      manager tags. Keys and values can be either in numeric
      format, such as `tagKeys/{tag_key_id}` and
      `tagValues/{tag_value_id}` or in namespaced format such as
      `{org_id|project_id}/{tag_key_short_name}` and
      `{tag_value_short_name}`. The field is ignored (both PUT &
      PATCH) when empty.
    $ref: ResourceManagerTagsValue.yaml
  resourcePolicies:
    description: |-
      Resource policies applied to this disk for automatic
      snapshot creations. Specified using the full or partial
      URL. For instance template, specify only the resource
      policy name.
    type: array
    items:
      type: string
  sourceImage:
    description: |-
      The source image to create this disk. When creating a
      new instance boot disk, one of
      initializeParams.sourceImage
      orinitializeParams.sourceSnapshot or disks.source is
      required.  To create a disk with one of the public
      operating system images, specify the image by its
      family name. For example, specifyfamily/debian-9 to
      use the latest Debian 9 image:  projects/debian-
      cloud/global/images/family/debian-9   Alternatively,
      use a specific version of a public operating system
      image:  projects/debian-
      cloud/global/images/debian-9-stretch-vYYYYMMDD   To
      create a disk with a custom image that you created,
      specify the image name in the following
    type: string
  sourceImageEncryptionKey:
    description: |-
      Thecustomer-supplied encryption key of the source
      image. Required if the source image is protected by a
      customer- supplied encryption key.  InstanceTemplate
      and InstancePropertiesPatch do not storecustomer-
      supplied encryption keys, so you cannot create disks
      for instances in a managed instance group if the
      source images are encrypted with your own keys.
    $ref: CustomerEncryptionKey.yaml
  sourceInstantSnapshot:
    description: |-
      The source instant-snapshot to create this disk. When
      creating a new instance boot disk, one of
      initializeParams.sourceSnapshot or initializeParams.so
      urceInstantSnapshotinitializeParams.sourceImage or
      disks.source is required.  To create a disk with a
      snapshot that you created, specify the snapshot name
      in the following format:  us-
      central1-a/instantSnapshots/my-backup   If the source
      instant-snapshot is deleted later, this field will not
      be set.
    type: string
  sourceSnapshot:
    description: |-
      The source snapshot to create this disk. When creating
      a new instance boot disk, one of
      initializeParams.sourceSnapshot
      orinitializeParams.sourceImage or disks.source is
      required.  To create a disk with a snapshot that you
      created, specify the snapshot name in the following
      format:  global/snapshots/my-backup   If the source
      snapshot is deleted later, this field will not be set.
      Note: You cannot create VMs in bulk using a snapshot
      as the source. Use an image instead when you create
      VMs using the bulk insert method.
    type: string
  sourceSnapshotEncryptionKey:
    description: |-
      Thecustomer-supplied encryption key of the source
      snapshot.
    $ref: CustomerEncryptionKey.yaml
  storagePool:
    description: |-
      The storage pool in which the new disk is created. You
      can provide this as a partial or full URL to the
      resource. For example, the following are valid values:
      - https://www.googleapis.com/co mpute/v1/projects/proj
      ect/zones/zone/storagePools/storagePool      -
      projects/project/zones/zone/storagePools/storagePool
      - zones/zone/storagePools/storagePool
    type: string
