$schema: "http://json-schema.org/draft-06/schema#"

title: compute alpha AttachedDisk export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  autoDelete:
    description: |-
      Specifies whether the disk will be auto-deleted when the instance is
      deleted (but not when the disk is detached from the instance).
    type: boolean
  boot:
    description: |-
      Indicates that this is a boot disk. The virtual machine will use the first
      partition of the disk for its root filesystem.
    type: boolean
  deviceName:
    description: |-
      Specifies a unique device name of your choice that is reflected into
      the/dev/disk/by-id/google-* tree of a Linux operating system running
      within the instance. This name can be used to reference the device for
      mounting, resizing, and so on, from within the instance. If not specified,
      the server chooses a default device name to apply to this disk, in the
      form persistent-disk-x, where x is a number assigned by Google Compute
      Engine. This field is only applicable for persistent disks.
    type: string
  diskEncryptionKey:
    description: |-
      Encrypts or decrypts a disk using acustomer-supplied encryption key.  If
      you are creating a new disk, this field encrypts the new disk using an
      encryption key that you provide. If you are attaching an existing disk
      that is already encrypted, this field decrypts the disk using the
      customer-supplied encryption key.  If you encrypt a disk using a customer-
      supplied key, you must provide the same key again when you attempt to use
      this resource at a later time. For example, you must provide the key when
      you create a snapshot or an image from the disk or when you attach the
      disk to a virtual machine instance.  If you do not provide an encryption
      key, then the disk will be encrypted using an automatically generated key
      and you do not need to provide a key to use the disk later.  Note:
      Instance templates do not storecustomer-supplied encryption keys, so you
      cannot use your own keys to encrypt disks in amanaged instance group.  You
      cannot create VMs that have disks with customer-supplied keys using the
      bulk insert method.
    $ref: CustomerEncryptionKey.yaml
  diskSizeGb:
    description: The size of the disk in GB.
    type: integer
  forceAttach:
    description: |-
      [Input Only] Whether to force attach the regional disk even if it's
      currently attached to another instance. If you try to force attach a zonal
      disk to an instance, you will receive an error.
    type: boolean
  guestOsFeatures:
    description: |-
      A list of features to enable on the guest operating system. Applicable
      only for bootable images. Read Enabling guest operating system features to
      see a list of available options.
    type: array
    items:
      $ref: GuestOsFeature.yaml
  initializeParams:
    description: |-
      [Input Only] Specifies the parameters for a new disk that will be
      created alongside the new instance. Use initialization parameters to
      create boot disks or local SSDs attached to the new instance.  This
      property is mutually exclusive with the source property; you can only
      define one or the other, but not both.
    $ref: AttachedDiskInitializeParams.yaml
  interface:
    description: |-
      Specifies the disk interface to use for attaching this disk, which is
      either SCSI or NVME. For most machine types, the default is SCSI.
      Local SSDs can use either NVME or SCSI. In certain configurations,
      persistent disks can use NVMe. For more information, seeAbout
      persistent disks.
    type: string
    enum:
    - NVDIMM
    - NVME
    - SCSI
  mode:
    description: |-
      The mode in which to attach this disk, either READ_WRITE orREAD_ONLY.
      If not specified, the default is to attach the disk in READ_WRITE
      mode.
    type: string
    enum:
    - READ_ONLY
    - READ_WRITE
  source:
    description: |-
      Specifies a valid partial or full URL to an existing Persistent Disk
      resource. When creating a new instance boot disk, one
      ofinitializeParams.sourceImage orinitializeParams.sourceSnapshot or
      disks.source is required.  If desired, you can also attach existing
      non- root persistent disks using this property. This field is only
      applicable for persistent disks.  Note that for InstanceTemplate,
      specify the disk name for zonal disk, and the URL for regional disk.
    type: string
  type:
    description: |-
      Specifies the type of the disk, either SCRATCH orPERSISTENT. If not
      specified, the default isPERSISTENT.
    type: string
    enum:
    - PERSISTENT
    - SCRATCH
