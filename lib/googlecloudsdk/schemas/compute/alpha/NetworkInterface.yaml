$schema: "http://json-schema.org/draft-06/schema#"

title: compute alpha NetworkInterface export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  accessConfigs:
    description: |-
      An array of configurations for this interface. Currently, only one access
      config, ONE_TO_ONE_NAT, is supported. If there are noaccessConfigs
      specified, then this instance will have no external internet access.
    type: array
    items:
      $ref: AccessConfig.yaml
  aliasIpRanges:
    description: |-
      An array of alias IP ranges for this network interface. You can only
      specify this field for network interfaces in VPC networks.
    type: array
    items:
      $ref: AliasIpRange.yaml
  aliasIpv6Ranges:
    description: |-
      An array of alias IPv6 ranges for this network interface. You can
      only specify this field for network interfaces in VPC networks.
    type: array
    items:
      $ref: AliasIpRange.yaml
  dns64Eligible:
    description: |-
      If true, this network interface is eligible for DNS64. This
      field is only supported for dual-stack (IPV4_IPV6) network
      interfaces.
    type: boolean
  enableVpcScopedDns:
    description: |-
      If true, DNS resolution will be enabled over this interface.
      Only valid with network_attachment.
    type: boolean
  fingerprint:
    description: |-
      Fingerprint hash of contents stored in this network interface.
      This field will be ignored when inserting an Instance or
      adding a NetworkInterface. An up-to-date fingerprint must be
      provided in order to update theNetworkInterface. The request
      will fail with error400 Bad Request if the fingerprint is not
      provided, or412 Precondition Failed if the fingerprint is out
      of date.
    type: string
  igmpQuery:
    description: |-
      Indicate whether igmp query is enabled on the network
      interface or not. If enabled, also indicates the version of
      IGMP supported.
    type: string
    enum:
    - IGMP_QUERY_DISABLED
    - IGMP_QUERY_V2
  internalIpv6PrefixLength:
    description: |-
      The prefix length of the primary internal IPv6 range.
    type: integer
  ipv6AccessConfigs:
    description: |-
      An array of IPv6 access configurations for this interface.
      Currently, only one IPv6 access config, DIRECT_IPV6, is
      supported. If there is no ipv6AccessConfig specified, then
      this instance will have no external IPv6 Internet access.
    type: array
    items:
      $ref: AccessConfig.yaml
  ipv6Address:
    description: |-
      An IPv6 internal network address for this network
      interface. To use a static internal IP address, it must be
      unused and in the same region as the instance's zone. If
      not specified, Google Cloud will automatically assign an
      internal IPv6 address from the instance's subnetwork.
    type: string
  nat64Eligible:
    description: |-
      If true, this network interface is eligible for NAT64.
      This field is only supported for dual-stack (IPV4_IPV6)
      network interfaces.
    type: boolean
  network:
    description: |-
      URL of the VPC network resource for this instance. When
      creating an instance, if neither the network nor the
      subnetwork is specified, the default network
      global/networks/default is used. If the selected project
      doesn't have the default network, you must specify a
      network or subnet. If the network is not specified but the
      subnetwork is specified, the network is inferred.  If you
      specify this property, you can specify the network as a
      full or partial URL. For example, the following are all
      valid URLs:               -
      https://www.googleapis.com/compute/v1/projec
      ts/project/global/networks/network       -
      projects/project/global/networks/network       -
      global/networks/default
    type: string
  networkAttachment:
    description: |-
      The URL of the network attachment that this interface
      should connect to in the following format:
      projects/{project_number}/reg ions/{region_name}/networkAt
      tachments/{network_attachment_name}.
    type: string
  networkIP:
    description: |-
      An IPv4 internal IP address to assign to the instance for
      this network interface. If not specified by the user, an
      unused internal IP is assigned by the system.
    type: string
  nicType:
    description: |-
      The type of vNIC to be used on this interface. This may be
      gVNIC or VirtioNet.
    type: string
    enum:
    - GVNIC
    - IDPF
    - IRDMA
    - MRDMA
    - UNSPECIFIED_NIC_TYPE
    - VIRTIO_NET
  parentNicName:
    description: |-
      Name of the parent network interface of a dynamic network
      interface.
    type: string
  queueCount:
    description: |-
      The networking queue count that's specified by users for
      the network interface. Both Rx and Tx queues will be set
      to this number. It'll be empty if not specified by the
      users.
    type: integer
  serviceClassId:
    description: |-
      Producer Service's Service class Id for the region of this
      network interface. Can only be used with
      network_attachment. It is not possible to use on its own
      however, network_attachment can be used without
      service_class_id.
    type: string
  stackType:
    description: |-
      The stack type for this network interface. To assign only
      IPv4 addresses, use IPV4_ONLY. To assign both IPv4 and
      IPv6 addresses, useIPV4_IPV6. If not specified, IPV4_ONLY
      is used.  This field can be both set at instance creation
      and update network interface operations.
    type: string
    enum:
    - IPV4_IPV6
    - IPV4_ONLY
    - IPV6_ONLY
  subinterfaces:
    description: |-
      SubInterfaces help enable L2 communication for the
      instance over subnetworks that support L2. Every network
      interface will get a default untagged (vlan not specified)
      subinterface. Users can specify additional tagged
      subinterfaces which are sub-fields to the Network
      Interface.
    type: array
    items:
      $ref: NetworkInterfaceSubInterface.yaml
  subnetwork:
    description: |-
      The URL of the Subnetwork resource for this instance.
      If the network resource is inlegacy mode, do not
      specify this field. If the network is in auto subnet
      mode, specifying the subnetwork is optional. If the
      network is in custom subnet mode, specifying the
      subnetwork is required. If you specify this field, you
      can specify the subnetwork as a full or partial URL.
      For example, the following are all valid URLs: - https
      ://www.googleapis.com/compute/v1/projects/project/regi
      ons/region/ subnetworks/subnetwork     -
      regions/region/subnetworks/subnetwork
    type: string
  vlan:
    description: |-
      VLAN tag of a dynamic network interface, must be  an
      integer in the range from 2 to 255 inclusively.
    type: integer
