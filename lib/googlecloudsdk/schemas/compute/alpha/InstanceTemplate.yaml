$schema: "http://json-schema.org/draft-06/schema#"

title: compute alpha InstanceTemplate export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  description:
    description: |-
      An optional description of this resource. Provide this property when you
      create the resource.
    type: string
  name:
    description: |-
      Name of the resource; provided by the client when the resource is created.
      The name must be 1-63 characters long, and comply withRFC1035.
      Specifically, the name must be 1-63 characters long and match the regular
      expression `[a-z]([-a-z0-9]*[a-z0-9])?` which means the first character
      must be a lowercase letter, and all following characters must be a dash,
      lowercase letter, or digit, except the last character, which cannot be a
      dash.
    type: string
  properties:
    description: The instance properties for this instance template.
    $ref: InstanceProperties.yaml
  sourceInstance:
    description: |-
      The source instance used to create the template. You can provide this as a
      partial or full URL to the resource. For example, the following are valid
      values:              - https://www.googleapis.com/co
      mpute/v1/projects/project/zones/zone/instances/instance     -
      projects/project/zones/zone/instances/instance
    type: string
  sourceInstanceParams:
    description: |-
      The source instance params to use to create this instance template.
    $ref: SourceInstanceParams.yaml
