$schema: "http://json-schema.org/draft-06/schema#"

title: compute beta AdvancedMachineFeatures export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  enableNestedVirtualization:
    description: |-
      Whether to enable nested virtualization or not (default is false).
    type: boolean
  enableUefiNetworking:
    description: Whether to enable UEFI networking for instance creation.
    type: boolean
  performanceMonitoringUnit:
    description: Type of Performance Monitoring Unit requested on instance.
    type: string
    enum:
    - ARCHITECTURAL
    - ENHANCED
    - PERFORMANCE_MONITORING_UNIT_UNSPECIFIED
    - STANDARD
  threadsPerCore:
    description: |-
      The number of threads per physical core. To disable simultaneous
      multithreading (SMT) set this to 1. If unset, the maximum number of
      threads supported per core by the underlying processor is assumed.
    type: integer
  turboMode:
    description: Turbo frequency mode to use for the instance. Supported modes
    type: string
  visibleCoreCount:
    description: |-
      The number of physical cores to expose to an instance. Multiply by the
      number of threads per core to compute the total number of virtual CPUs to
      expose to the instance. If unset, the number of cores is inferred from the
      instance's nominal CPU count and the underlying platform's SMT width.
    type: integer
