$schema: "http://json-schema.org/draft-06/schema#"

title: compute beta InstanceProperties export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  advancedMachineFeatures:
    description: |-
      Controls for advanced machine-related behavior features. Note that for
      MachineImage, this is not supported yet.
    $ref: AdvancedMachineFeatures.yaml
  canIpForward:
    description: |-
      Enables instances created based on these properties to send packets with
      source IP addresses other than their own and receive packets with
      destination IP addresses other than their own. If these instances will be
      used as an IP gateway or it will be set as the next- hop in a Route
      resource, specify true. If unsure, leave this set tofalse. See theEnable
      IP forwarding documentation for more information.
    type: boolean
  confidentialInstanceConfig:
    description: |-
      Specifies the Confidential Instance options. Note that for MachineImage,
      this is not supported yet.
    $ref: ConfidentialInstanceConfig.yaml
  description:
    description: |-
      An optional text description for the instances that are created from these
      properties.
    type: string
  disks:
    description: |-
      An array of disks that are associated with the instances that are created
      from these properties.
    type: array
    items:
      $ref: AttachedDisk.yaml
  displayDevice:
    description: |-
      Display Device properties to enable support for remote display
      products like: Teradici, VNC and TeamViewer Note that for
      MachineImage, this is not supported yet.
    $ref: DisplayDevice.yaml
  guestAccelerators:
    description: |-
      A list of guest accelerator cards' type and count to use for instances
      created from these properties.
    type: array
    items:
      $ref: AcceleratorConfig.yaml
  keyRevocationActionType:
    description: |-
      KeyRevocationActionType of the instance. Supported options are
      "STOP" and "NONE". The default value is "NONE" if it is not
      specified.
    type: string
    enum:
    - KEY_REVOCATION_ACTION_TYPE_UNSPECIFIED
    - NONE
    - STOP
  labels:
    description: |-
      Labels to apply to instances that are created from these
      properties.
    $ref: LabelsValue.yaml
  localSsdEncryptionMode:
    description: |-
      Specifies which method should be used for encrypting the Local
      SSDs attached to the VM.
    type: string
    enum:
    - EPHEMERAL_KEY_ENCRYPTION
    - LOCAL_SSD_ENCRYPTION_MODE_UNSPECIFIED
    - STANDARD_ENCRYPTION
  machineType:
    description: |-
      The machine type to use for instances that are created from these
      properties. This field only accepts a machine type name, for
      example `n2-standard-4`. If you use the machine type full or
      partial URL, for example `projects/my-l7ilb-project/zones/us-
      central1-a/machineTypes/n2-standard-4`, the request will result in
      an `INTERNAL_ERROR`.
    type: string
  metadata:
    description: |-
      The metadata key/value pairs to assign to instances that are
      created from these properties. These pairs can consist of custom
      metadata or predefined keys. SeeProject and instance metadata for
      more information.
    $ref: Metadata.yaml
  minCpuPlatform:
    description: |-
      Minimum cpu/platform to be used by instances. The instance may be
      scheduled on the specified or newer cpu/platform. Applicable
      values are the friendly names of CPU platforms, such
      asminCpuPlatform: "Intel Haswell" orminCpuPlatform: "Intel Sandy
      Bridge". For more information, read Specifying a Minimum CPU
      Platform.
    type: string
  networkInterfaces:
    description: |-
      An array of network access configurations for this interface.
    type: array
    items:
      $ref: NetworkInterface.yaml
  networkPerformanceConfig:
    description: |-
      Note that for MachineImage, this is not supported yet.
    $ref: NetworkPerformanceConfig.yaml
  partnerMetadata:
    description: |-
      Partner Metadata assigned to the instance properties. A map
      from a subdomain (namespace) to entries map.
    $ref: PartnerMetadataValue.yaml
  postKeyRevocationActionType:
    description: PostKeyRevocationActionType of the instance.
    type: string
    enum:
    - NOOP
    - POST_KEY_REVOCATION_ACTION_TYPE_UNSPECIFIED
    - SHUTDOWN
  privateIpv6GoogleAccess:
    description: |-
      The private IPv6 google access type for VMs. If not specified,
      use  INHERIT_FROM_SUBNETWORK as default. Note that for
      MachineImage, this is not supported yet.
    type: string
    enum:
    - ENABLE_BIDIRECTIONAL_ACCESS_TO_GOOGLE
    - ENABLE_OUTBOUND_VM_ACCESS_TO_GOOGLE
    - INHERIT_FROM_SUBNETWORK
  reservationAffinity:
    description: |-
      Specifies the reservations that instances can consume from.
      Note that for MachineImage, this is not supported yet.
    $ref: ReservationAffinity.yaml
  resourceManagerTags:
    description: |-
      Input only. Resource manager tags to be bound to the instance.
      Tag keys and values have the same definition as resource
      manager tags. Keys and values can be either in numeric format,
      such as `tagKeys/{tag_key_id}` and `tagValues/{tag_value_id}`
      or in namespaced format such as
      `{org_id|project_id}/{tag_key_short_name}` and
      `{tag_value_short_name}`. The field is ignored (both PUT &
      PATCH) when empty.
    $ref: ResourceManagerTagsValue.yaml
  resourcePolicies:
    description: |-
      Resource policies (names, not URLs) applied to instances
      created from these properties. Note that for MachineImage,
      this is not supported yet.
    type: array
    items:
      type: string
  scheduling:
    description: |-
      Specifies the scheduling options for the instances that
      are created from these properties.
    $ref: Scheduling.yaml
  serviceAccounts:
    description: |-
      A list of service accounts with specified scopes. Access
      tokens for these service accounts are available to the
      instances that are created from these properties. Use
      metadata queries to obtain the access tokens for these
      instances.
    type: array
    items:
      $ref: ServiceAccount.yaml
  shieldedInstanceConfig:
    description: |-
      Note that for MachineImage, this is not supported yet.
    $ref: ShieldedInstanceConfig.yaml
  shieldedVmConfig:
    description: |-
      Specifies the Shielded VM options for the instances
      that are created from these properties.
    $ref: ShieldedVmConfig.yaml
  tags:
    description: |-
      A list of tags to apply to the instances that are
      created from these properties. The tags identify valid
      sources or targets for network firewalls. The setTags
      method can modify this list of tags. Each tag within
      the list must comply with RFC1035.
    $ref: Tags.yaml
  workloadIdentityConfig:
    description: A WorkloadIdentityConfig attribute.
    $ref: WorkloadIdentityConfig.yaml
