$schema: "http://json-schema.org/draft-06/schema#"

title: compute beta CustomerEncryptionKey export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  kmsKeyName:
    description: |-
      The name of the encryption key that is stored in Google Cloud KMS. For
      example:  "kmsKeyName":
      "projects/kms_project_id/locations/region/keyRings/
      key_region/cryptoKeys/key  The fully-qualifed key name may be returned for
      resource GET requests. For  example:   "kmsKeyName":
      "projects/kms_project_id/locations/region/keyRings/
      key_region/cryptoKeys/key /cryptoKeyVersions/1
    type: string
  kmsKeyServiceAccount:
    description: |-
      The service account being used for the encryption request for the given
      KMS key. If absent, the Compute Engine default service account is used.
      For example:  "kmsKeyServiceAccount":
      "name@project_id.iam.gserviceaccount.com/
    type: string
  rawKey:
    description: |-
      [DEPRECATED] CSEK is no longer supported. Use CMEK instead. Specifies a
      256-bit customer-supplied encryption key, encoded in RFC 4648 base64 to
      either encrypt or decrypt this resource. You can provide either the rawKey
      or thersaEncryptedKey. For example:  "rawKey":
      "SGVsbG8gZnJvbSBHb29nbGUgQ2xvdWQgUGxhdGZvcm0="
    type: string
  rsaEncryptedKey:
    description: |-
      [DEPRECATED] CSEK is no longer supported. Use CMEK instead. Specifies an
      RFC 4648 base64 encoded, RSA-wrapped 2048-bit customer-supplied encryption
      key to either encrypt or decrypt this resource. You can provide either the
      rawKey or thersaEncryptedKey. For
    type: string
  sha256:
    description: |-
      [DEPRECATED] CSEK is no longer supported. Use CMEK instead. [Output only]
      TheRFC 4648 base64 encoded SHA-256 hash of the customer- supplied
      encryption key that protects this resource.
    type: string
