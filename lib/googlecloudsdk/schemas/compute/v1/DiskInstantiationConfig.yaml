$schema: "http://json-schema.org/draft-06/schema#"

title: compute v1 DiskInstantiationConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  autoDelete:
    description: |-
      Specifies whether the disk will be auto-deleted when the instance is
      deleted (but not when the disk is detached from the instance).
    type: boolean
  customImage:
    description: |-
      The custom source image to be used to restore this disk when instantiating
      this instance template.
    type: string
  deviceName:
    description: |-
      Specifies the device name of the disk to which the configurations apply
      to.
    type: string
  instantiateFrom:
    description: |-
      Specifies whether to include the disk and what image to use. Possible
      values are:              - source-image: to use the same image that was
      used to      create the source instance's corresponding disk. Applicable
      to the boot      disk and additional read-write disks. - source-image-
      family: to use the same image family that      was used to create the
      source instance's corresponding disk. Applicable      to the boot disk and
      additional read-write disks.      - custom-image: to use a user-provided
      image url for disk      creation. Applicable to the boot disk and
      additional read-write      disks.     - attach-read-only: to attach a
      read-only      disk. Applicable to read-only disks.      - do-not-include:
      to exclude a disk from the template.      Applicable to additional read-
      write disks, local SSDs, and read-only      disks.
    type: string
    enum:
    - ATTACH_READ_ONLY
    - BLANK
    - CUSTOM_IMAGE
    - DEFAULT
    - DO_NOT_INCLUDE
    - SOURCE_IMAGE
    - SOURCE_IMAGE_FAMILY
