$schema: "http://json-schema.org/draft-06/schema#"

title: networkservices v1alpha1 ExtensionBinding export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- producerExtension
- target
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  description:
    description: A human-readable description of the resource.
    type: string
  etag:
    description: |-
      Etag of the resource. If provided, it must match the server's etag. If the
      provided etag does not match the server's etag, the request will fail with
      a 409 ABORTED error.
    type: string
  failOpen:
    description: |-
      Determines the behavior of the extension binding when the call to the
      extension fails or times out. Default value is `FALSE`. When set to
      `TRUE`, failures of the extension are silently ignored.
    type: boolean
  labels:
    description: |-
      Set of labels associated with the `ExtensionBinding` resource. The format
      must comply with [the following
      requirements](https://cloud.google.com/compute/docs/labeling-
      resources#requirements).
    $ref: LabelsValue.yaml
  matchConditions:
    description: |-
      A list of match conditions to match against the incoming request. The
      extension will be invoked if at least one condition matches the request,
      or if no match conditions are specified. Limited to 5 conditions.
    type: array
    items:
      $ref: ExtensionBindingMatchCondition.yaml
  name:
    description: |-
      Identifier. Name of the `ExtensionBinding` resource in the following
    type: string
  priority:
    description: |-
      Priority of the extension binding. Lower numbers indicate higher
      priority. Priority of extension bindings are used to determine the
      order in which extension bindings are applied to a request.
    type: integer
  producerExtension:
    description: |-
      The name of the extension that this binding should attach to target
      resources. Format: For Google-provided extensions, specify the service
      endpoint (see [Model Armor
      integration](https://docs.cloud.google.com/model-armor/integrations))
    type: string
  producerMetadata:
    description: |-
      Additional metadata that should be passed to the attached extension
      with each request.
    $ref: ProducerMetadataValue.yaml
  target:
    description: |-
      Specifies a target to which this `ExtensionBinding` should be
      attached. The target can be either a single resource or a scope of
      resources.
    $ref: ExtensionBindingTarget.yaml
