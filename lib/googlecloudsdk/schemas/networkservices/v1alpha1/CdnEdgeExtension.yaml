$schema: "http://json-schema.org/draft-06/schema#"

title: networkservices v1alpha1 CdnEdgeExtension export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- extensionChains
- name
- target
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  description:
    description: A human-readable description of the resource.
    type: string
  extensionChains:
    description: |-
      A set of ordered extension chains that contain the match conditions and
      extensions to execute. Match conditions for each extension chain are
      evaluated in sequence for a given request. The first extension chain that
      has a condition that matches the request is executed. Any subsequent
      extension chains do not execute. Limited to 5 extension chains per
      resource.
    type: array
    items:
      $ref: ExtensionChain.yaml
  labels:
    description: |-
      Set of labels associated with the `CdnEdgeExtension` resource. The
      format must comply with [the requirements for
      labels](https://cloud.google.com/compute/docs/labeling-
      resources#requirements) for Google Cloud resources.
    $ref: LabelsValue.yaml
  name:
    description: |-
      Identifier. Name of the `CdnEdgeExtension` resource in the following
      format: `projects/{project}/locations/{location}/cdnEdgeExtens
      ions/{cdn_edge_extension}`.
    type: string
  target:
    description: |-
      Specifies the set of resources to which this extension should be
      applied to.
    $ref: CdnEdgeExtensionTarget.yaml
