$schema: "http://json-schema.org/draft-06/schema#"

title: networkservices v1alpha1 CdnEdgeExtensionTarget export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- resources
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  resources:
    description: |-
      A list of references to the resources that are targeted by
      `CdnEdgeExtension`. Types of resources supported: `EdgeCacheService`. The
      format must be the full resource name of
      [EdgeCacheService](https://cloud.google.com/media-
      cdn/docs/reference/rest/v1/projects.locations.edgeCacheServices) in the
      following format: `//networkservices.googleapis.com/projects/{project}/l
      ocations/{location}/edgeCacheServices/{edgeCacheService}`.
    type: array
    items:
      type: string
