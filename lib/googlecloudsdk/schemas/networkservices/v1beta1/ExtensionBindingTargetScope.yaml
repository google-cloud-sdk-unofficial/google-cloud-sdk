$schema: "http://json-schema.org/draft-06/schema#"

title: networkservices v1beta1 ExtensionBindingTargetScope export schema
description: A gcloud export/import command YAML validation schema.
type: object
required:
- parent
- resourceTypes
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  parent:
    description: |-
      Parent resource name specification, in the format:
      `projects/{project_number}`.
    type: string
  resourceTypes:
    description: |-
      Type of the resource to which the binding should attach. Limited to 1
      resource type.
    type: array
    items:
      type: string
      enum:
      - AGENT_GATEWAY
      - AI_APPLICATION
      - RESOURCE_TYPE_UNSPECIFIED
