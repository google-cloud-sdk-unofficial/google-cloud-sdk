$schema: "http://json-schema.org/draft-06/schema#"

title: networkservices v1beta1 EgressNetworkConfig export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  dnsPeeringConfig:
    description: DNS Peering configuration.
    $ref: DnsPeeringConfig.yaml
  networkAttachment:
    description: |-
      The network attachment resource name. Format:
      projects/{project}/regions/{region}/networkAttachments/{network_attachme
      nt_id}
    type: string
  trustConfig:
    description: |-
      Deprecated: Use tls_config instead. The trust config resource name.
      Format:
      projects/{project}/locations/{location}/trustConfigs/{trust_config}
    type: string
  vpcEgress:
    description: The VPC egress setting.
    type: string
    enum:
    - ALL_TRAFFIC
    - PRIVATE_RANGES_ONLY
    - VPC_EGRESS_UNSPECIFIED
